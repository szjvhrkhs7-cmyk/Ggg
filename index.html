<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет задач банковского юриста</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 24px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .stat-card .label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-card.overdue .value {
            color: #e74c3c;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0f3460;
            color: white;
        }

        .btn-primary:hover {
            background: #1a4a7a;
        }

        .btn-secondary {
            background: #e8ecf1;
            color: #1a1a2e;
        }

        .btn-secondary:hover {
            background: #d5dbe3;
        }

        .btn-danger {
            background: #fee;
            color: #e74c3c;
        }

        .btn-danger:hover {
            background: #fdd;
        }

        .btn-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-success:hover {
            background: #c8e6c9;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: #0f3460;
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
            cursor: pointer;
        }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fb;
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #eee;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: #eef0f4;
        }

        th .sort-arrow {
            margin-left: 4px;
            opacity: 0.3;
        }

        th.sorted .sort-arrow {
            opacity: 1;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: top;
        }

        tr:hover {
            background: #f8f9fb;
        }

        tr.overdue {
            background: #fff5f5;
        }

        tr.completed {
            background: #f0faf0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-new {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-in-progress {
            background: #fff3e0;
            color: #e65100;
        }

        .status-waiting {
            background: #fce4ec;
            color: #c62828;
        }

        .status-completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .actions .btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal h2 {
            font-size: 20px;
            margin-bottom: 24px;
            color: #1a1a2e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #0f3460;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .text-truncate {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .expand-text {
            white-space: normal;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                padding: 16px 20px;
            }

            .header h1 {
                font-size: 18px;
            }

            .modal {
                padding: 24px;
                width: 95%;
            }

            td, th {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Учет задач банковского юриста</h1>
        <p>Система управления юридическими задачами</p>
    </div>

    <div class="container">
        <div class="stats" id="stats"></div>

        <div class="controls">
            <button class="btn btn-primary" onclick="openModal()">+ Новая задача</button>
            <input type="text" class="search-box" id="searchBox" placeholder="Поиск по задачам..." oninput="renderTasks()">
            <select class="filter-select" id="filterStatus" onchange="renderTasks()">
                <option value="all">Все статусы</option>
                <option value="new">Новая</option>
                <option value="in-progress">В работе</option>
                <option value="waiting">Ожидание доп. информации</option>
                <option value="completed">Завершена</option>
            </select>
            <button class="btn btn-secondary" onclick="exportCSV()">Экспорт CSV</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortBy('id')">№ <span class="sort-arrow">&#9650;</span></th>
                        <th onclick="sortBy('dateReceived')">Дата поступления <span class="sort-arrow">&#9650;</span></th>
                        <th onclick="sortBy('summary')">Краткая суть <span class="sort-arrow">&#9650;</span></th>
                        <th onclick="sortBy('additionalInfo')">Доп. информация <span class="sort-arrow">&#9650;</span></th>
                        <th onclick="sortBy('responseDate')">Дата ответа <span class="sort-arrow">&#9650;</span></th>
                        <th onclick="sortBy('status')">Статус <span class="sort-arrow">&#9650;</span></th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <h2 id="modalTitle">Новая задача</h2>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="dateReceived">Дата поступления *</label>
                    <input type="date" id="dateReceived" required>
                </div>
                <div class="form-group">
                    <label for="summary">Краткая суть задачи *</label>
                    <textarea id="summary" placeholder="Опишите суть задачи..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="additionalInfo">Что требуется получить дополнительно</label>
                    <textarea id="additionalInfo" placeholder="Укажите необходимые документы, сведения..."></textarea>
                </div>
                <div class="form-group">
                    <label for="responseDate">Дата предоставления ответа</label>
                    <input type="date" id="responseDate">
                </div>
                <div class="form-group">
                    <label for="status">Статус</label>
                    <select id="status">
                        <option value="new">Новая</option>
                        <option value="in-progress">В работе</option>
                        <option value="waiting">Ожидание доп. информации</option>
                        <option value="completed">Завершена</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="notes">Примечания</label>
                    <textarea id="notes" placeholder="Дополнительные заметки..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('lawyerTasks') || '[]');
        let currentSort = { field: 'id', direction: 'desc' };

        function getNextId() {
            if (tasks.length === 0) return 1;
            return Math.max(...tasks.map(t => t.id)) + 1;
        }

        function saveTasks() {
            localStorage.setItem('lawyerTasks', JSON.stringify(tasks));
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const [y, m, d] = dateStr.split('-');
            return `${d}.${m}.${y}`;
        }

        function statusLabel(status) {
            const labels = {
                'new': 'Новая',
                'in-progress': 'В работе',
                'waiting': 'Ожидание',
                'completed': 'Завершена'
            };
            return labels[status] || status;
        }

        function statusClass(status) {
            return 'status-' + status;
        }

        function isOverdue(task) {
            if (task.status === 'completed' || !task.responseDate) return false;
            return new Date(task.responseDate) < new Date(new Date().toISOString().split('T')[0]);
        }

        function updateStats() {
            const total = tasks.length;
            const active = tasks.filter(t => t.status !== 'completed').length;
            const overdue = tasks.filter(t => isOverdue(t)).length;
            const completedThisMonth = tasks.filter(t => {
                if (t.status !== 'completed') return false;
                const now = new Date();
                const taskDate = new Date(t.responseDate || t.dateReceived);
                return taskDate.getMonth() === now.getMonth() && taskDate.getFullYear() === now.getFullYear();
            }).length;

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="label">Всего задач</div>
                    <div class="value">${total}</div>
                </div>
                <div class="stat-card">
                    <div class="label">В работе</div>
                    <div class="value">${active}</div>
                </div>
                <div class="stat-card ${overdue > 0 ? 'overdue' : ''}">
                    <div class="label">Просрочено</div>
                    <div class="value">${overdue}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Завершено в этом месяце</div>
                    <div class="value">${completedThisMonth}</div>
                </div>
            `;
        }

        function getFilteredTasks() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            let filtered = tasks.filter(t => {
                const matchesSearch = !search ||
                    t.summary.toLowerCase().includes(search) ||
                    (t.additionalInfo && t.additionalInfo.toLowerCase().includes(search)) ||
                    (t.notes && t.notes.toLowerCase().includes(search)) ||
                    String(t.id).includes(search);
                const matchesFilter = filterStatus === 'all' || t.status === filterStatus;
                return matchesSearch && matchesFilter;
            });

            filtered.sort((a, b) => {
                let valA = a[currentSort.field];
                let valB = b[currentSort.field];
                if (currentSort.field === 'id') {
                    valA = Number(valA);
                    valB = Number(valB);
                }
                if (valA == null) valA = '';
                if (valB == null) valB = '';
                let cmp = valA < valB ? -1 : valA > valB ? 1 : 0;
                return currentSort.direction === 'asc' ? cmp : -cmp;
            });

            return filtered;
        }

        function sortBy(field) {
            if (currentSort.field === field) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.field = field;
                currentSort.direction = 'asc';
            }
            renderTasks();
        }

        function renderTasks() {
            updateStats();
            const filtered = getFilteredTasks();
            const tbody = document.getElementById('taskTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <p>${tasks.length === 0 ? 'Нет задач' : 'Нет задач, соответствующих фильтру'}</p>
                                <p style="font-size: 13px">${tasks.length === 0 ? 'Нажмите "Новая задача" чтобы добавить первую' : ''}</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(task => {
                const rowClass = task.status === 'completed' ? 'completed' : isOverdue(task) ? 'overdue' : '';
                return `
                    <tr class="${rowClass}">
                        <td>${task.id}</td>
                        <td style="white-space:nowrap">${formatDate(task.dateReceived)}</td>
                        <td class="text-truncate" title="${escapeHtml(task.summary)}">${escapeHtml(task.summary)}</td>
                        <td class="text-truncate" title="${escapeHtml(task.additionalInfo || '')}">${escapeHtml(task.additionalInfo || '—')}</td>
                        <td style="white-space:nowrap">${formatDate(task.responseDate)}</td>
                        <td><span class="status-badge ${statusClass(task.status)}">${statusLabel(task.status)}</span></td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-secondary" onclick="editTask(${task.id})">Изменить</button>
                                ${task.status !== 'completed' ? `<button class="btn btn-success" onclick="completeTask(${task.id})">Завершить</button>` : ''}
                                <button class="btn btn-danger" onclick="deleteTask(${task.id})">Удалить</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal(taskId) {
            document.getElementById('modalTitle').textContent = taskId ? 'Редактировать задачу' : 'Новая задача';
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';

            if (!taskId) {
                document.getElementById('dateReceived').value = new Date().toISOString().split('T')[0];
            }

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnOverlay(e) {
            if (e.target === e.currentTarget) closeModal();
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('modalTitle').textContent = 'Редактировать задачу';
            document.getElementById('taskId').value = task.id;
            document.getElementById('dateReceived').value = task.dateReceived;
            document.getElementById('summary').value = task.summary;
            document.getElementById('additionalInfo').value = task.additionalInfo || '';
            document.getElementById('responseDate').value = task.responseDate || '';
            document.getElementById('status').value = task.status;
            document.getElementById('notes').value = task.notes || '';

            document.getElementById('modalOverlay').classList.add('active');
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const taskData = {
                dateReceived: document.getElementById('dateReceived').value,
                summary: document.getElementById('summary').value.trim(),
                additionalInfo: document.getElementById('additionalInfo').value.trim(),
                responseDate: document.getElementById('responseDate').value,
                status: document.getElementById('status').value,
                notes: document.getElementById('notes').value.trim()
            };

            if (id) {
                const idx = tasks.findIndex(t => t.id === Number(id));
                if (idx !== -1) {
                    tasks[idx] = { ...tasks[idx], ...taskData };
                }
            } else {
                taskData.id = getNextId();
                taskData.createdAt = new Date().toISOString();
                tasks.push(taskData);
            }

            saveTasks();
            closeModal();
            renderTasks();
        }

        function completeTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            task.status = 'completed';
            if (!task.responseDate) {
                task.responseDate = new Date().toISOString().split('T')[0];
            }
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            if (!confirm('Удалить задачу №' + id + '?')) return;
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function exportCSV() {
            if (tasks.length === 0) {
                alert('Нет задач для экспорта');
                return;
            }
            const headers = ['№', 'Дата поступления', 'Краткая суть', 'Доп. информация', 'Дата ответа', 'Статус', 'Примечания'];
            const rows = getFilteredTasks().map(t => [
                t.id,
                formatDate(t.dateReceived),
                '"' + (t.summary || '').replace(/"/g, '""') + '"',
                '"' + (t.additionalInfo || '').replace(/"/g, '""') + '"',
                formatDate(t.responseDate),
                statusLabel(t.status),
                '"' + (t.notes || '').replace(/"/g, '""') + '"'
            ]);

            const BOM = '﻿';
            const csv = BOM + [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tasks_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        renderTasks();
    </script>
</body>
</html>
