<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data: blob:;">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Задачи">
    <meta name="theme-color" content="#ffffff">
    <title>Учет задач</title>
    <link rel="icon" type="image/png" href="icon-180.png?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#ffffff; --bg2:#f7f7f5; --hover:#f1f1ef; --text:#37352f;
            --sec:#787774; --light:#b4b4b0; --blue:#2383e2; --blue-bg:#e8f0fe;
            --red:#eb5757; --red-bg:#fbe4e4; --green:#4daa57; --green-bg:#dbeddb;
            --orange:#d9730d; --orange-bg:#fadec9; --border:#e3e2de;
            --radius:8px; --font:-apple-system,'Inter',BlinkMacSystemFont,'Segoe UI',sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html{scroll-behavior:smooth}
        body{
            font-family:var(--font); background:var(--bg2); color:var(--text);
            min-height:100vh; min-height:-webkit-fill-available;
            padding-bottom:calc(70px + env(safe-area-inset-bottom));
            -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
        }
        .header{
            background:var(--bg); padding:calc(12px + env(safe-area-inset-top)) 16px 0;
            position:sticky; top:0; z-index:100;
            border-bottom:1px solid var(--border);
        }
        .header h1{font-size:15px;font-weight:700;color:var(--text)}
        .header-sub{font-size:11px;color:var(--sec);margin-top:1px}
        .nav-bar{display:flex;gap:20px;margin-top:10px}
        .nav-btn{
            padding:8px 0; font-size:13px; font-weight:600; font-family:var(--font);
            color:var(--sec); background:none; border:none;
            border-bottom:2px solid transparent; cursor:pointer;
            transition:color .15s,border-color .15s;
        }
        .nav-btn.active{color:var(--text);border-bottom-color:var(--text)}
        .nav-count{
            font-size:11px; font-weight:600; color:var(--sec);
            background:var(--bg2); border-radius:10px; padding:1px 6px; margin-left:4px;
        }
        .nav-btn.active .nav-count{background:var(--blue-bg);color:var(--blue)}
        .container{max-width:640px;margin:0 auto;padding:12px 16px}
        .page{display:none}
        .page.active{display:block;animation:fadeIn .2s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .stats-line{
            font-size:12px; color:var(--sec); padding:10px 0 12px;
            display:flex; gap:6px; flex-wrap:wrap; align-items:center;
        }
        .stats-line .s-val{font-weight:700;color:var(--text)}
        .stats-line .s-over{color:var(--red);font-weight:700}
        .stats-line .s-dot{color:var(--light)}
        .controls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
        .controls-row{display:flex;gap:8px}
        .search-box{
            flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius);
            font-size:16px; font-family:var(--font); outline:none;
            background:var(--bg); color:var(--text); transition:border-color .2s;
        }
        .search-box:focus{border-color:var(--blue)}
        .search-box::placeholder{color:var(--light)}
        .filter-select{
            padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius);
            font-size:16px; font-family:var(--font); outline:none;
            background:var(--bg); color:var(--text); cursor:pointer; flex:1;
        }
        .btn{
            padding:7px 14px; border:none; border-radius:6px; cursor:pointer;
            font-size:13px; font-weight:600; font-family:var(--font);
            transition:opacity .15s; touch-action:manipulation;
        }
        .btn:active{opacity:.7}
        .btn-primary{background:var(--blue);color:#fff}
        .btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
        .btn-danger{background:var(--red-bg);color:var(--red)}
        .btn-success{background:var(--green-bg);color:var(--green)}
        .btn-calendar{background:var(--blue-bg);color:var(--blue)}
        .btn-reopen{background:var(--orange-bg);color:var(--orange)}
        .btn-backup{background:var(--green-bg);color:var(--green)}
        .btn-restore{background:var(--orange-bg);color:var(--orange)}
        .backup-row{display:flex;gap:8px;margin-bottom:8px}
        .backup-row .btn{flex:1;font-size:12px;padding:7px 6px}
        .backup-info{font-size:11px;color:var(--sec);text-align:center;margin-bottom:12px}
        .task-list{display:flex;flex-direction:column;gap:8px}
        .task-card{
            background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
            padding:12px 14px; transition:background .15s;
        }
        .task-card:active{background:var(--bg2)}
        .task-card.overdue{border-left:3px solid var(--red)}
        .task-card.completed{border-left:3px solid var(--green);opacity:.75}
        .task-card.priority-high-card{border-left:3px solid var(--red)}
        .task-card.priority-medium-card{border-left:3px solid var(--orange)}
        .task-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
        .task-number{font-size:11px;color:var(--sec);font-weight:600}
        .priority-badge{
            font-size:10px; font-weight:600; padding:2px 6px;
            border-radius:4px; margin-left:6px; text-transform:uppercase;
        }
        .priority-high{background:var(--red-bg);color:var(--red)}
        .priority-medium{background:var(--orange-bg);color:var(--orange)}
        .priority-low{background:var(--blue-bg);color:var(--blue)}
        .status-badge{
            font-size:10px; font-weight:600; padding:2px 8px;
            border-radius:4px; text-transform:uppercase; letter-spacing:.2px;
        }
        .status-new{background:var(--blue-bg);color:var(--blue)}
        .status-in-progress{background:var(--orange-bg);color:var(--orange)}
        .status-waiting{background:#f3e8ff;color:#9333ea}
        .status-completed{background:var(--green-bg);color:var(--green)}
        .task-summary{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:8px}
        .task-details{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
        .task-detail{display:flex;gap:6px;font-size:12px}
        .task-detail-label{color:var(--sec);font-weight:500;min-width:70px;flex-shrink:0}
        .task-detail-value{color:var(--text);word-break:break-word}
        .overdue-date{color:var(--red);font-weight:600}
        .task-notes-block{
            background:var(--bg2); border-radius:6px; padding:8px 10px;
            margin-bottom:8px; font-size:12px; color:var(--sec); line-height:1.5;
        }
        .task-notes-block b,.task-notes-block strong{color:var(--text)}
        .task-notes-block ul,.task-notes-block ol{padding-left:18px;margin:4px 0}
        .task-notes-block li{margin-bottom:2px}
        .completed-date{font-size:11px;color:var(--sec);margin-top:4px}
        .task-actions{display:flex;gap:6px;flex-wrap:wrap}
        .task-actions .btn{flex:1;padding:6px 4px;font-size:11px;text-align:center;min-width:0}
        .completed-toggle{
            display:flex;align-items:center;gap:8px;padding:10px 0;margin-top:12px;
            cursor:pointer;font-size:13px;font-weight:600;color:var(--sec);
            border:none;background:none;font-family:var(--font);
        }
        .completed-toggle:active{opacity:.6}
        .completed-toggle-arrow{
            display:inline-block;font-size:10px;transition:transform .2s;
        }
        .completed-toggle.open .completed-toggle-arrow{transform:rotate(90deg)}
        .completed-toggle-count{
            font-size:11px;color:var(--sec);background:var(--bg);
            border:1px solid var(--border);border-radius:10px;padding:1px 7px;
        }
        .completed-section{overflow:hidden;max-height:0;transition:max-height .4s ease-out}
        .completed-section.open{max-height:9999px;transition:max-height .6s ease-in}
        .completed-section .task-list{padding-top:8px}
        .project-list,.notes-list{display:flex;flex-direction:column;gap:8px}
        .project-card,.note-card{
            background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
            padding:12px 14px; cursor:pointer; transition:background .15s;
        }
        .project-card:active,.note-card:active{background:var(--bg2)}
        .project-card-header{display:flex;justify-content:space-between;align-items:center}
        .project-name{font-size:14px;font-weight:600;color:var(--text)}
        .project-count{font-size:11px;color:var(--sec);background:var(--bg2);padding:2px 8px;border-radius:10px}
        .project-desc{font-size:12px;color:var(--sec);margin-top:4px;line-height:1.4}
        .project-actions,.note-actions{display:flex;gap:6px;margin-top:10px}
        .project-actions .btn,.note-actions .btn{padding:6px 12px;font-size:12px}
        .project-inner-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
        .back-btn{
            background:var(--bg2);color:var(--text);border:1px solid var(--border);
            border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;
            font-family:var(--font);cursor:pointer;
        }
        .project-title{font-size:15px;font-weight:700;color:var(--text);flex:1}
        .note-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
        .note-card-preview{font-size:12px;color:var(--sec);line-height:1.4;max-height:42px;overflow:hidden}
        .note-card-date{font-size:11px;color:var(--light);margin-top:6px}
        .note-editor-page{display:none}
        .note-editor-page.active{display:block}
        .note-editor-actions{display:flex;gap:8px;margin-bottom:12px}
        .note-editor-actions .btn{font-size:13px;padding:7px 14px}
        .note-title-input{
            width:100%;padding:8px 0;border:none;border-bottom:1px solid var(--border);
            font-size:18px;font-weight:700;font-family:var(--font);
            outline:none;background:transparent;color:var(--text);margin-bottom:10px;
        }
        .note-title-input:focus{border-bottom-color:var(--blue)}
        .note-title-input::placeholder{color:var(--light)}
        .modal-overlay{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,.3);z-index:1000;
            justify-content:center;align-items:flex-end;
        }
        .modal-overlay.active{display:flex}
        .modal{
            background:var(--bg);border-radius:12px 12px 0 0;
            padding:16px 16px calc(20px + env(safe-area-inset-bottom));
            width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
            box-shadow:0 -4px 24px rgba(0,0,0,.08);
            animation:slideUp .25s ease-out;
        }
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-handle{width:32px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px}
        .modal h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
        .form-group{margin-bottom:14px}
        .form-group label{
            display:block;font-size:11px;font-weight:600;color:var(--sec);
            margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;
        }
        .form-group input,.form-group textarea,.form-group select{
            width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
            font-size:16px;font-family:var(--font);outline:none;
            background:var(--bg);color:var(--text);transition:border-color .2s;
        }
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus{
            border-color:var(--blue);box-shadow:0 0 0 2px rgba(35,131,226,.12);
        }
        .form-group textarea{resize:none;min-height:48px;overflow:hidden}
        .form-group input::placeholder,.form-group textarea::placeholder{color:var(--light)}
        .form-group select option{background:var(--bg);color:var(--text)}
        .form-row{display:flex;gap:10px}
        .form-row .form-group{flex:1;margin-bottom:14px}
        .editor-toolbar{
            display:flex;gap:4px;padding:6px 8px;background:var(--bg2);
            border:1px solid var(--border);border-bottom:none;
            border-radius:var(--radius) var(--radius) 0 0;
        }
        .editor-toolbar button{
            background:none;border:1px solid transparent;border-radius:4px;
            padding:4px 10px;font-size:13px;cursor:pointer;color:var(--sec);
            font-family:var(--font);font-weight:600;transition:background .1s;
        }
        .editor-toolbar button:active{background:var(--border)}
        .editor-area,.note-body-editor{
            border:1px solid var(--border);border-top:none;
            border-radius:0 0 var(--radius) var(--radius);
            padding:10px 12px;min-height:80px;font-size:15px;font-family:var(--font);
            color:var(--text);line-height:1.6;background:var(--bg);outline:none;
        }
        .editor-area:focus,.note-body-editor:focus{border-color:var(--blue)}
        .editor-area:empty:before,.note-body-editor:empty:before{content:attr(data-placeholder);color:var(--light)}
        .editor-area ul,.editor-area ol,.note-body-editor ul,.note-body-editor ol{padding-left:20px;margin:4px 0}
        .editor-area li,.note-body-editor li{margin-bottom:2px}
        .note-body-editor{min-height:200px;font-size:15px}
        .modal-actions{display:flex;gap:8px;margin-top:16px}
        .modal-actions .btn{flex:1;padding:10px;font-size:14px}
        .fab{
            position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;
            width:48px;height:48px;border-radius:50%;
            background:var(--blue);color:#fff;border:none;font-size:24px;font-weight:300;
            box-shadow:0 2px 12px rgba(35,131,226,.3);cursor:pointer;z-index:50;
            display:flex;align-items:center;justify-content:center;
            transition:transform .2s,box-shadow .2s;
        }
        .fab:active{transform:scale(.9)}
        .empty-state{text-align:center;padding:40px 16px;color:var(--sec)}
        .empty-state-icon{font-size:36px;margin-bottom:8px;opacity:.5}
        .empty-state p{font-size:14px;margin-bottom:2px}
        .empty-state .sub{font-size:12px;color:var(--light)}
        @media(min-width:600px){
            .modal{border-radius:12px;margin:auto;max-width:480px}
            .modal-overlay.active{align-items:center}
            @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Задачи юриста</h1>
        <div class="header-sub">Управление задачами</div>
        <div class="nav-bar">
            <button class="nav-btn active" id="navTasks" onclick="navigate('tasks')">Задачи<span class="nav-count" id="navTasksCount">0</span></button>
            <button class="nav-btn" id="navProjects" onclick="navigate('projects')">Проекты<span class="nav-count" id="navProjectsCount">0</span></button>
            <button class="nav-btn" id="navNotes" onclick="navigate('notes')">Заметки<span class="nav-count" id="navNotesCount">0</span></button>
        </div>
    </div>
    <div class="container">
        <div class="page active" id="pageTasks">
            <div class="stats-line" id="stats"></div>
            <div class="controls">
                <input type="text" class="search-box" id="searchBox" placeholder="Поиск задач..." oninput="renderTasks()">
                <div class="controls-row">
                    <select class="filter-select" id="filterStatus" onchange="renderTasks()">
                        <option value="all">Все активные</option>
                        <option value="new">Новая</option>
                        <option value="in-progress">В работе</option>
                        <option value="waiting">Ожидание</option>
                    </select>
                    <button class="btn btn-secondary" onclick="exportCSV()">CSV</button>
                </div>
            </div>
            <div class="backup-row">
                <button class="btn btn-backup" onclick="backupData()">Сохранить копию</button>
                <button class="btn btn-restore" onclick="document.getElementById('restoreFile').click()">Восстановить</button>
                <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(event)">
            </div>
            <div class="backup-info" id="backupInfo"></div>
            <div class="task-list" id="taskList"></div>
        </div>
        <div class="page" id="pageProjects">
            <div id="projectListView">
                <button class="btn btn-primary" onclick="openProjectModal()" style="width:100%;margin-bottom:12px">+ Новый проект</button>
                <div class="project-list" id="projectList"></div>
            </div>
            <div id="projectDetailView" style="display:none">
                <div class="project-inner-header">
                    <button class="back-btn" onclick="closeProjectDetail()">&#8592; Назад</button>
                    <div class="project-title" id="projectDetailTitle"></div>
                </div>
                <div class="task-list" id="projectTaskList"></div>
            </div>
        </div>
        <div class="page" id="pageNotes">
            <div id="notesListView">
                <input type="text" class="search-box" id="searchNotes" placeholder="Поиск заметок..." oninput="renderNotes()" style="margin-bottom:12px;width:100%">
                <div class="notes-list" id="notesList"></div>
            </div>
            <div id="noteEditorView" class="note-editor-page">
                <div class="note-editor-actions">
                    <button class="btn btn-secondary" onclick="closeNoteEditor()">&#8592; Назад</button>
                    <button class="btn btn-primary" onclick="saveCurrentNote()">Сохранить</button>
                    <button class="btn btn-danger" id="noteDeleteBtn" onclick="deleteCurrentNote()" style="display:none">Удалить</button>
                </div>
                <input type="text" class="note-title-input" id="noteTitle" placeholder="Заголовок...">
                <div class="editor-toolbar" id="noteEditorToolbar">
                    <button type="button" onclick="nCmd('bold')"><b>B</b></button>
                    <button type="button" onclick="nCmd('insertUnorderedList')">&#8226; Список</button>
                </div>
                <div class="note-body-editor" id="noteBody" contenteditable="true" data-placeholder="Начните писать..."></div>
            </div>
        </div>
    </div>
    <button class="fab" id="fabBtn" onclick="onFabClick()">+</button>

    <div class="modal-overlay" id="taskModal" onclick="closeModalOv(event,'taskModal')">
        <div class="modal">
            <div class="modal-handle"></div>
            <h2 id="taskModalTitle">Новая задача</h2>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <input type="hidden" id="taskProjectId" value="">
                <input type="hidden" id="dateReceived">
                <div class="form-group"><label>Краткая суть задачи *</label><textarea id="summary" placeholder="Опишите суть задачи..." required oninput="autoGrow(this)"></textarea></div>
                <div class="form-group"><label>Что требуется дополнительно</label><textarea id="additionalInfo" placeholder="Документы, сведения..." oninput="autoGrow(this)"></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Дата ответа</label><input type="date" id="responseDate"></div>
                    <div class="form-group"><label>Напоминание</label>
                        <select id="reminderDays"><option value="0">В день ответа</option><option value="1" selected>За 1 день</option><option value="2">За 2 дня</option><option value="3">За 3 дня</option><option value="7">За неделю</option></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Значимость</label>
                        <select id="priority"><option value="none">Обычная</option><option value="low">Низкая</option><option value="medium">Средняя</option><option value="high">Высокая</option></select>
                    </div>
                    <div class="form-group"><label>Статус</label>
                        <select id="status"><option value="new">Новая</option><option value="in-progress">В работе</option><option value="waiting">Ожидание</option><option value="completed">Завершена</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Заметки</label>
                    <div class="editor-toolbar">
                        <button type="button" onclick="edCmd('bold')"><b>B</b></button>
                        <button type="button" onclick="edCmd('insertUnorderedList')">&#8226; Список</button>
                    </div>
                    <div class="editor-area" id="notesEditor" contenteditable="true" data-placeholder="Заметки к задаче..."></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('taskModal')">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="projectModal" onclick="closeModalOv(event,'projectModal')">
        <div class="modal">
            <div class="modal-handle"></div>
            <h2 id="projectModalTitle">Новый проект</h2>
            <form id="projectForm" onsubmit="saveProject(event)">
                <input type="hidden" id="projectId">
                <div class="form-group"><label>Название *</label><input type="text" id="projectName" placeholder="Название проекта" required></div>
                <div class="form-group"><label>Описание</label><textarea id="projectDesc" placeholder="Описание..." oninput="autoGrow(this)"></textarea></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('projectModal')">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="calendarModal" onclick="closeModalOv(event,'calendarModal')">
        <div class="modal">
            <div class="modal-handle"></div>
            <h2>Календарь</h2>
            <input type="hidden" id="calTaskId">
            <input type="hidden" id="calProjectId">
            <div id="calTaskInfo" style="font-size:13px;color:var(--sec);margin-bottom:14px;padding:10px 12px;background:var(--bg2);border-radius:var(--radius);line-height:1.4"></div>
            <div class="form-group"><label>Дата *</label><input type="date" id="calDate" required></div>
            <div class="form-group"><label>Время *</label><input type="time" id="calTime" required></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('calendarModal')">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="confirmCalendar()">Добавить</button>
            </div>

function nextId(a){return(!a||!a.length)?1:Math.max.apply(null,a.map(function(t){return t.id}))+1}
function fmtDate(d){if(!d)return'—';var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function fmtDateTime(iso){if(!iso)return'';var d=new Date(iso);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function stLabel(s){return{new:'Новая','in-progress':'В работе',waiting:'Ожидание',completed:'Завершена'}[s]||s}
function isOverdue(t){return t.status!=='completed'&&t.responseDate&&new Date(t.responseDate)<new Date(new Date().toISOString().split('T')[0])}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

var ALLOWED_TAGS=['B','I','U','UL','OL','LI','BR','FONT','SPAN','P','DIV','STRONG','EM','S','H2','H3','H4','BLOCKQUOTE','HR','SUB','SUP'];
function sanitizeHtml(html){
    if(!html)return'';
    var tmp=document.createElement('div');tmp.innerHTML=html;
    function clean(node){
        Array.from(node.childNodes).forEach(function(child){
            if(child.nodeType===3)return;
            if(child.nodeType===1){
                if(ALLOWED_TAGS.indexOf(child.tagName)===-1){node.replaceChild(document.createTextNode(child.textContent),child);return}
                Array.from(child.attributes).forEach(function(a){
                    if(a.name.indexOf('on')===0||a.value.trim().toLowerCase().indexOf('javascript:')===0)child.removeAttribute(a.name);
                });
                if(child.hasAttribute('style')){
                    if(/expression|url\s*\(|import|behavior|\\|@/i.test(child.style.cssText))child.removeAttribute('style');
                }
                if(child.tagName==='FONT'){
                    var ok=['size','color','face'];
                    Array.from(child.attributes).forEach(function(a){if(ok.indexOf(a.name)===-1)child.removeAttribute(a.name)});
                }
                clean(child);
            }else{node.removeChild(child)}
        });
    }
    clean(tmp);return tmp.innerHTML;
}

var VALID_STATUSES=['new','in-progress','waiting','completed'];
var VALID_PRIORITIES=['none','low','medium','high'];
function sanitizeTask(t){
    if(!t||typeof t!=='object')return null;
    return{id:typeof t.id==='number'?t.id:0,dateReceived:typeof t.dateReceived==='string'?t.dateReceived.slice(0,10):'',summary:typeof t.summary==='string'?t.summary.slice(0,2000):'',additionalInfo:typeof t.additionalInfo==='string'?t.additionalInfo.slice(0,2000):'',responseDate:typeof t.responseDate==='string'?t.responseDate.slice(0,10):'',reminderDays:typeof t.reminderDays==='number'?Math.min(Math.max(t.reminderDays,0),30):1,priority:VALID_PRIORITIES.indexOf(t.priority)!==-1?t.priority:'none',status:VALID_STATUSES.indexOf(t.status)!==-1?t.status:'new',notes:sanitizeHtml(typeof t.notes==='string'?t.notes.slice(0,50000):''),createdAt:typeof t.createdAt==='string'?t.createdAt:new Date().toISOString(),completedAt:typeof t.completedAt==='string'?t.completedAt.slice(0,10):undefined};
}
function sanitizeNote(n){
    if(!n||typeof n!=='object')return null;
    return{id:typeof n.id==='number'?n.id:0,title:typeof n.title==='string'?n.title.slice(0,500):'',body:sanitizeHtml(typeof n.body==='string'?n.body.slice(0,100000):''),createdAt:typeof n.createdAt==='string'?n.createdAt:new Date().toISOString(),updatedAt:typeof n.updatedAt==='string'?n.updatedAt:new Date().toISOString()};
}

function edCmd(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('notesEditor').focus()}
function nCmd(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('noteBody').focus()}
var _agT=0;
function autoGrow(el){clearTimeout(_agT);_agT=setTimeout(function(){el.style.height='auto';el.style.height=el.scrollHeight+'px'},50)}

function navigate(p){
    currentPage=p;

    document.getElementById('fabBtn').style.display='flex';
    if(p==='tasks')renderTasks();
    else if(p==='projects'){closeProjectDetail();renderProjects()}

function updateNav(){

    document.getElementById('navProjectsCount').textContent=projects.length;
    document.getElementById('navNotesCount').textContent=userNotes.length;
}
function updateStats(){
    var a=tasks.filter(function(t){return t.status!=='completed'}).length;
    var o=tasks.filter(function(t){return isOverdue(t)}).length;
    var c=tasks.filter(function(t){return t.status==='completed'}).length;
    document.getElementById('stats').innerHTML=
        '<span class="s-val">'+a+'</span> в работе <span class="s-dot">&middot;</span> '+
        (o?'<span class="s-over">'+o+'</span>':'<span class="s-val">0</span>')+' просрочено <span class="s-dot">&middot;</span> '+
        '<span class="s-val">'+c+'</span> завершено';
}

function getList(pid){pid=pid?String(pid):null;return pid?projectTasks[pid]||[]:tasks}
function setList(pid,l){pid=pid?String(pid):null;if(pid){projectTasks[pid]=l;saveProjectTasks()}else{tasks=l;saveTasks()}}
function getFiltered(list,sId,fId,active){
    var s=document.getElementById(sId)?document.getElementById(sId).value.toLowerCase():'';
    var f=fId&&document.getElementById(fId)?document.getElementById(fId).value:'all';
    var r=list.filter(function(t){
        if(active&&t.status==='completed')return false;
        if(!active&&t.status!=='completed')return false;
        var ms=!s||t.summary.toLowerCase().indexOf(s)!==-1||(t.additionalInfo&&t.additionalInfo.toLowerCase().indexOf(s)!==-1)||String(t.id).indexOf(s)!==-1;
        var mf=!fId||f==='all'||t.status===f;
        return ms&&mf;
    });
    var pw={high:3,medium:2,low:1,none:0};
    if(active)r.sort(function(a,b){return(pw[b.priority||'none']||0)-(pw[a.priority||'none']||0)||(b.id-a.id)});
    else r.sort(function(a,b){return b.id-a.id});
    return r;
}

function cardHtml(t,done,pid){
    pid=pid?Number(pid):null;
    var pri=VALID_PRIORITIES.indexOf(t.priority)!==-1?t.priority:'none';
    var cls=done?'completed':isOverdue(t)?'overdue':'';
    if(!done&&(pri==='high'||pri==='medium'))cls+=' priority-'+pri+'-card';
    var dc=isOverdue(t)?'overdue-date':'';
    var plbl={high:'Высокая',medium:'Средняя',low:'Низкая'};
    var priH=pri!=='none'?'<span class="priority-badge priority-'+pri+'">'+plbl[pri]+'</span>':'';
    var safeNotes=t.notes?sanitizeHtml(t.notes):'';
    var notesH=safeNotes?'<div class="task-notes-block">'+safeNotes+'</div>':'';
    var addH=t.additionalInfo?'<div class="task-detail"><span class="task-detail-label">Доп. инфо</span><span class="task-detail-value">'+esc(t.additionalInfo)+'</span></div>':'';
    var cdH=t.completedAt?'<div class="completed-date">Завершена: '+fmtDate(t.completedAt)+'</div>':'';
    var safeStatus=VALID_STATUSES.indexOf(t.status)!==-1?t.status:'new';
    var pa=pid?','+pid:'';
    var acts;
    if(done){
        acts='<div class="task-actions"><button class="btn btn-reopen" onclick="reopenTask('+t.id+pa+')">В работу</button><button class="btn btn-danger" onclick="deleteTask('+t.id+pa+')">Удалить</button></div>';
    }else{
        acts='<div class="task-actions"><button class="btn btn-secondary" onclick="editTask('+t.id+pa+')">Изменить</button><button class="btn btn-success" onclick="completeTask('+t.id+pa+')">Готово</button><button class="btn btn-calendar" onclick="openCalendarModal('+t.id+pa+')">Календарь</button><button class="btn btn-danger" onclick="deleteTask('+t.id+pa+')">Удалить</button></div>';
    }
    return '<div class="task-card '+cls+'">'+
        '<div class="task-card-header"><span class="task-number">#'+t.id+priH+'</span><span class="status-badge status-'+safeStatus+'">'+stLabel(safeStatus)+'</span></div>'+
        '<div class="task-summary">'+esc(t.summary)+'</div>'+
        '<div class="task-details">'+
        '<div class="task-detail"><span class="task-detail-label">Поступила</span><span class="task-detail-value">'+fmtDate(t.dateReceived)+'</span></div>'+
        addH+
        '<div class="task-detail"><span class="task-detail-label">Ответ до</span><span class="task-detail-value '+dc+'">'+fmtDate(t.responseDate)+'</span></div>'+
        '</div>'+notesH+cdH+acts+'</div>';
}

function renderTasks(){
    updateStats();updateNav();
    var f=getFiltered(tasks,'searchBox','filterStatus',true),el=document.getElementById('taskList');
    var h=f.length?f.map(function(t){return cardHtml(t,false)}).join(''):'<div class="empty-state"><div class="empty-state-icon">&#128221;</div><p>Нет активных задач</p><p class="sub">Нажмите + чтобы добавить</p></div>';
    var done=tasks.filter(function(t){return t.status==='completed'}).sort(function(a,b){return b.id-a.id});
    if(done.length){
        h+='<button class="completed-toggle '+(completedOpen?'open':'')+'" onclick="toggleCompleted()"><span class="completed-toggle-arrow">&#9654;</span>Завершённые<span class="completed-toggle-count">'+done.length+'</span></button>';
        h+='<div class="completed-section '+(completedOpen?'open':'')+'"><div class="task-list">'+done.map(function(t){return cardHtml(t,true)}).join('')+'</div></div>';
    }
    el.innerHTML=h;updateBackupInfo();
}
function toggleCompleted(){
    completedOpen=!completedOpen;
    var tog=document.querySelector('.completed-toggle');
    var sec=document.querySelector('.completed-section');
    if(tog)tog.classList.toggle('open',completedOpen);

function openTaskModal(pid){
    document.getElementById('taskModalTitle').textContent='Новая задача';
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value='';
    document.getElementById('taskProjectId').value=pid||'';

    document.getElementById('notesEditor').innerHTML='';
    document.querySelectorAll('#taskForm textarea').forEach(function(t){t.style.height='auto'});
    document.getElementById('taskModal').classList.add('active');
}
function editTask(id,pid){
    var l=getList(pid),t=l.find(function(x){return x.id===id});if(!t)return;
    document.getElementById('taskModalTitle').textContent='Редактировать #'+t.id;
    document.getElementById('taskId').value=t.id;
    document.getElementById('taskProjectId').value=pid||'';
    document.getElementById('dateReceived').value=t.dateReceived;
    document.getElementById('summary').value=t.summary;
    document.getElementById('additionalInfo').value=t.additionalInfo||'';
    document.getElementById('responseDate').value=t.responseDate||'';
    document.getElementById('reminderDays').value=t.reminderDays!=null?t.reminderDays:1;
    document.getElementById('priority').value=t.priority||'none';
    document.getElementById('status').value=t.status;
    document.getElementById('notesEditor').innerHTML=t.notes||'';
    document.querySelectorAll('#taskForm textarea').forEach(function(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'});
    document.getElementById('taskModal').classList.add('active');
}
function saveTask(e){
    e.preventDefault();
    var id=document.getElementById('taskId').value;
    var pid=document.getElementById('taskProjectId').value||null;
    var list=getList(pid);
    var ns=document.getElementById('status').value;
    var drVal=document.getElementById('dateReceived').value;
    var d={
        dateReceived:drVal||new Date().toISOString().split('T')[0],
        summary:document.getElementById('summary').value.trim(),
        additionalInfo:document.getElementById('additionalInfo').value.trim(),
        responseDate:document.getElementById('responseDate').value,
        reminderDays:parseInt(document.getElementById('reminderDays').value)||0,
        priority:document.getElementById('priority').value,
        status:ns,
        notes:sanitizeHtml(document.getElementById('notesEditor').innerHTML.trim())
    };
    if(ns==='completed')d.completedAt=new Date().toISOString().split('T')[0];
    if(id){var i=list.findIndex(function(x){return x.id===Number(id)});if(i!==-1)list[i]=Object.assign({},list[i],d)}
    else{d.id=nextId(list);d.createdAt=new Date().toISOString();list.push(d)}
    setList(pid,list);closeModal('taskModal');refreshView();
}
function completeTask(id,pid){
    var l=getList(pid),t=l.find(function(x){return x.id===id});if(!t)return;
    t.status='completed';t.completedAt=new Date().toISOString().split('T')[0];
    if(!t.responseDate)t.responseDate=t.completedAt;
    setList(pid,l);refreshView();
}
function reopenTask(id,pid){
    var l=getList(pid),t=l.find(function(x){return x.id===id});if(!t)return;
    t.status='in-progress';delete t.completedAt;
    setList(pid,l);refreshView();
}
function deleteTask(id,pid){
    if(!confirm('Удалить задачу #'+id+'?'))return;
    setList(pid,getList(pid).filter(function(x){return x.id!==id}));refreshView();
}

function openCalendarModal(id,pid){
    var t=getList(pid).find(function(x){return x.id===id});if(!t)return;
    document.getElementById('calTaskId').value=id;
    document.getElementById('calProjectId').value=pid||'';
    var pl={high:'Высокая',medium:'Средняя',low:'Низкая'};
    var pt=t.priority&&t.priority!=='none'?' ('+pl[t.priority]+')':'';
    document.getElementById('calTaskInfo').innerHTML='<b>#'+t.id+pt+'</b><br>'+esc(t.summary);
    document.getElementById('calDate').value=t.responseDate||new Date().toISOString().split('T')[0];
    document.getElementById('calTime').value='09:00';
    document.getElementById('calendarModal').classList.add('active');
}
function confirmCalendar(){
    var id=Number(document.getElementById('calTaskId').value);
    var pid=document.getElementById('calProjectId').value||null;
    var t=getList(pid).find(function(x){return x.id===id});if(!t)return;
    var dateVal=document.getElementById('calDate').value;
    var timeVal=document.getElementById('calTime').value;
    if(!dateVal||!timeVal){alert('Укажите дату и время');return}
    var dt=dateVal.replace(/-/g,'')+'T'+timeVal.replace(/:/g,'')+'00';
    var endD=new Date(dateVal+'T'+timeVal);endD.setHours(endD.getHours()+1);
    var pad=function(n){return String(n).padStart(2,'0')};
    var et=endD.getFullYear()+pad(endD.getMonth()+1)+pad(endD.getDate())+'T'+pad(endD.getHours())+pad(endD.getMinutes())+'00';
    var pl={high:'ВЫСОКАЯ',medium:'СРЕДНЯЯ',low:'НИЗКАЯ'};
    var pt=t.priority&&t.priority!=='none'?' ['+pl[t.priority]+']':'';
    var desc=t.summary;
    if(t.additionalInfo)desc+='\\nДоп.: '+t.additionalInfo;
    if(t.responseDate)desc+='\\nОтвет до: '+fmtDate(t.responseDate);
    var plainNotes=t.notes?t.notes.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' '):'';
    if(plainNotes)desc+='\\nЗаметки: '+plainNotes;
    desc=desc.replace(/[\r\n]+/g,'\\n');
    var escI=function(s){return s.replace(/[\r\n]+/g,' ').replace(/[\\;,]/g,function(c){return'\\'+c})};
    var uid='task-'+t.id+'-'+Date.now()+'@lawyer-tasks';
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lawyer Tasks//RU','CALSCALE:GREGORIAN',
        'BEGIN:VEVENT','UID:'+uid,'DTSTART:'+dt,'DTEND:'+et,
        'SUMMARY:'+escI(t.summary+pt),'DESCRIPTION:'+escI(desc),
        'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Задача #'+t.id,'END:VALARM',
        'END:VEVENT','END:VCALENDAR'];
    var blob=new Blob([ics.join('\r\n')],{type:'text/calendar;charset=utf-8'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='task_'+t.id+'.ics';a.click();URL.revokeObjectURL(url);
    closeModal('calendarModal');
}

function renderProjects(){
    updateNav();var el=document.getElementById('projectList');
    if(!projects.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">&#128194;</div><p>Нет проектов</p><p class="sub">Создайте первый проект</p></div>';return}
    el.innerHTML=projects.map(function(p){
        var pts=projectTasks[p.id]||[];var ac=pts.filter(function(t){return t.status!=='completed'}).length;
        return '<div class="project-card" onclick="openProjectDetail('+p.id+')">'+
            '<div class="project-card-header"><span class="project-name">'+esc(p.name)+'</span><span class="project-count">'+ac+' акт.</span></div>'+
            (p.description?'<div class="project-desc">'+esc(p.description)+'</div>':'')+
            '<div class="project-actions" onclick="event.stopPropagation()">'+
            '<button class="btn btn-secondary" onclick="editProject('+p.id+')">Изменить</button>'+
            '<button class="btn btn-danger" onclick="deleteProject('+p.id+')">Удалить</button></div></div>';
    }).join('');
}
function openProjectModal(id){
    document.getElementById('projectForm').reset();document.getElementById('projectId').value='';
    document.getElementById('projectModalTitle').textContent='Новый проект';
    if(id){var p=projects.find(function(x){return x.id===id});if(p){document.getElementById('projectModalTitle').textContent='Редактировать';document.getElementById('projectId').value=p.id;document.getElementById('projectName').value=p.name;document.getElementById('projectDesc').value=p.description||''}}
    document.getElementById('projectModal').classList.add('active');
}
function editProject(id){openProjectModal(id)}
function saveProject(e){
    e.preventDefault();var id=document.getElementById('projectId').value;
    var d={name:document.getElementById('projectName').value.trim(),description:document.getElementById('projectDesc').value.trim()};
    if(id){var p=projects.find(function(x){return x.id===Number(id)});if(p){p.name=d.name;p.description=d.description}}
    else{d.id=projects.length?Math.max.apply(null,projects.map(function(x){return x.id}))+1:1;d.createdAt=new Date().toISOString();projects.push(d);if(!projectTasks[d.id])projectTasks[d.id]=[];saveProjectTasks()}
    saveProjects();closeModal('projectModal');renderProjects();
}
function deleteProject(id){
    var p=projects.find(function(x){return x.id===id});if(!p)return;
    var tc=(projectTasks[id]||[]).length;
    if(!confirm('Удалить проект "'+p.name+'"'+(tc?' и '+tc+' задач':'')+'?'))return;
    projects=projects.filter(function(x){return x.id!==id});delete projectTasks[id];
    saveProjects();saveProjectTasks();renderProjects();
}
function openProjectDetail(id){
    currentProjectId=id;var p=projects.find(function(x){return x.id===id});if(!p)return;

    document.getElementById('projectListView').style.display='none';
    document.getElementById('projectDetailView').style.display='block';

function closeProjectDetail(){currentProjectId=null;document.getElementById('projectListView').style.display='block';document.getElementById('projectDetailView').style.display='none';renderProjects()}
function renderProjectTasks(){
    if(!currentProjectId)return;
    var list=projectTasks[currentProjectId]||[],el=document.getElementById('projectTaskList');
    var active=list.filter(function(t){return t.status!=='completed'}),done=list.filter(function(t){return t.status==='completed'});
    var pw={high:3,medium:2,low:1,none:0};
    active.sort(function(a,b){return(pw[b.priority||'none']||0)-(pw[a.priority||'none']||0)||b.id-a.id});
    done.sort(function(a,b){return b.id-a.id});
    var h='';
    if(!active.length&&!done.length)h='<div class="empty-state"><div class="empty-state-icon">&#128221;</div><p>Нет задач</p><p class="sub">Нажмите + чтобы добавить</p></div>';
    else{
        h=active.map(function(t){return cardHtml(t,false,currentProjectId)}).join('');
        if(done.length)h+='<div style="margin:14px 0 8px;font-size:11px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.3px">Завершённые ('+done.length+')</div>'+done.map(function(t){return cardHtml(t,true,currentProjectId)}).join('');
    }
    el.innerHTML=h;
}

function renderNotes(){
    updateNav();var el=document.getElementById('notesList');
    var s=(document.getElementById('searchNotes').value||'').toLowerCase();
    var filtered=userNotes;
    if(s)filtered=userNotes.filter(function(n){return n.title.toLowerCase().indexOf(s)!==-1||(n.body&&n.body.toLowerCase().indexOf(s)!==-1)});
    filtered.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt)});
    if(!filtered.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">&#128196;</div><p>Нет заметок</p><p class="sub">Нажмите + чтобы создать</p></div>';return}
    el.innerHTML=filtered.map(function(n){
        var preview=n.body?n.body.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').slice(0,100):'';
        return '<div class="note-card" onclick="openNoteEditor('+n.id+')">'+
            '<div class="note-card-title">'+esc(n.title||'Без заголовка')+'</div>'+
            (preview?'<div class="note-card-preview">'+esc(preview)+(preview.length>=100?'...':'')+'</div>':'')+
            '<div class="note-card-date">'+fmtDateTime(n.updatedAt)+'</div></div>';
    }).join('');
}
function openNoteEditor(id){
    if(id){
        var n=userNotes.find(function(x){return x.id===id});if(!n)return;
        editingNoteId=id;
        document.getElementById('noteTitle').value=n.title||'';
        document.getElementById('noteBody').innerHTML=n.body||'';
        document.getElementById('noteDeleteBtn').style.display='inline-block';
    }else{
        editingNoteId=null;
        document.getElementById('noteTitle').value='';
        document.getElementById('noteBody').innerHTML='';
        document.getElementById('noteDeleteBtn').style.display='none';
    }
    document.getElementById('notesListView').style.display='none';
    document.getElementById('noteEditorView').style.display='block';
    document.getElementById('noteEditorView').classList.add('active');
    document.getElementById('fabBtn').style.display='none';
}
function closeNoteEditor(){
    editingNoteId=null;
    document.getElementById('notesListView').style.display='block';
    document.getElementById('noteEditorView').style.display='none';
    document.getElementById('noteEditorView').classList.remove('active');
    document.getElementById('fabBtn').style.display='flex';
    renderNotes();
}
function saveCurrentNote(){
    var title=document.getElementById('noteTitle').value.trim();
    var body=sanitizeHtml(document.getElementById('noteBody').innerHTML.trim());
    var bodyText=body.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();
    if(!title&&!bodyText){alert('Заметка пуста');return}
    if(editingNoteId){
        var n=userNotes.find(function(x){return x.id===editingNoteId});
        if(n){n.title=title;n.body=body;n.updatedAt=new Date().toISOString()}
    }else{
        userNotes.push({id:nextId(userNotes),title:title,body:body,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    }
    saveNotes();closeNoteEditor();
}
function deleteCurrentNote(){
    if(!editingNoteId)return;if(!confirm('Удалить заметку?'))return;
    userNotes=userNotes.filter(function(x){return x.id!==editingNoteId});
    saveNotes();closeNoteEditor();
}

function closeModal(id){document.getElementById(id).classList.remove('active')}
function closeModalOv(e,id){if(e.target===e.currentTarget)closeModal(id)}
function onFabClick(){
    if(currentPage==='tasks')openTaskModal();
    else if(currentPage==='projects'){if(currentProjectId)openTaskModal(currentProjectId);else openProjectModal()}
    else if(currentPage==='notes')openNoteEditor();
}
function refreshView(){
    if(currentPage==='tasks')renderTasks();
    else if(currentPage==='projects'){if(currentProjectId)renderProjectTasks();else renderProjects()}
    else if(currentPage==='notes')renderNotes();
}

function backupData(){
    var data={version:3,exportDate:new Date().toISOString(),tasks:tasks,projects:projects,projectTasks:projectTasks,userNotes:userNotes};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;
    a.download='tasks_backup_'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(url);
    localStorage.setItem('lastBackupDate',new Date().toISOString());updateBackupInfo();
}
function restoreData(event){
    var file=event.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
        try{
            var data=JSON.parse(e.target.result);var raw=[];
            if(data.tasks&&Array.isArray(data.tasks))raw=data.tasks;else if(Array.isArray(data))raw=data;
            else{alert('Неверный формат');return}
            var rt=raw.map(sanitizeTask).filter(Boolean);
            if(!rt.length){alert('Нет корректных задач');return}
            if(tasks.length>0&&!confirm('Заменить '+tasks.length+' задач на '+rt.length+' из файла?')){
                var mx=tasks.length?Math.max.apply(null,tasks.map(function(t){return t.id})):0;
                rt.forEach(function(t,i){t.id=mx+i+1});tasks=tasks.concat(rt);
            }else tasks=rt;
            if(data.projects&&Array.isArray(data.projects)){
                projects=data.projects.filter(function(p){return p&&typeof p==='object'&&typeof p.name==='string'})
                    .map(function(p){return{id:typeof p.id==='number'?p.id:0,name:p.name.slice(0,500),description:typeof p.description==='string'?p.description.slice(0,2000):'',createdAt:typeof p.createdAt==='string'?p.createdAt:new Date().toISOString()}});
                saveProjects();
            }
            if(data.projectTasks&&typeof data.projectTasks==='object'&&!Array.isArray(data.projectTasks)){
                var safePT={};
                Object.keys(data.projectTasks).forEach(function(k){
                    if(/^\d+$/.test(k)&&Array.isArray(data.projectTasks[k]))
                        safePT[k]=data.projectTasks[k].map(sanitizeTask).filter(Boolean);
                });
                projectTasks=safePT;saveProjectTasks();
            }
            if(data.userNotes&&Array.isArray(data.userNotes)){
                userNotes=data.userNotes.map(sanitizeNote).filter(Boolean);saveNotes();
            }
            saveTasks();refreshView();alert('Восстановлено: '+rt.length+' задач');
        }catch(err){alert('Ошибка чтения файла')}
    };
    reader.readAsText(file);event.target.value='';
}
function updateBackupInfo(){
    var lb=localStorage.getItem('lastBackupDate'),el=document.getElementById('backupInfo');
    if(!tasks.length){el.textContent='';return}
    if(lb){var days=Math.floor((new Date()-new Date(lb))/864e5);el.textContent='Последняя копия: '+fmtDate(new Date(lb).toISOString().split('T')[0])+(days>=3?' — сохраните новую!':'')}
    else el.textContent='Сохраните резервную копию!';
}
function exportCSV(){
    if(!tasks.length){alert('Нет задач');return}
    var pl={high:'Высокая',medium:'Средняя',low:'Низкая',none:'Обычная'};
    var h=['№','Дата поступления','Суть','Доп. инфо','Дата ответа','Значимость','Статус','Заметки'];
    var csvSafe=function(s){var v=(s||'').replace(/"/g,'""');if(/^[=+\-@|]/.test(v))v="'"+v;return'"'+v+'"'};
    var r=tasks.map(function(t){return[t.id,fmtDate(t.dateReceived),csvSafe(t.summary),csvSafe(t.additionalInfo),fmtDate(t.responseDate),pl[t.priority||'none'],stLabel(t.status),csvSafe((t.notes||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' '))]});
    var csv='﻿'+[h.join(';')].concat(r.map(function(x){return x.join(';')})).join('\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;
    a.download='tasks_'+new Date().toISOString().split('T')[0]+'.csv';a.click();URL.revokeObjectURL(url);
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal('taskModal');closeModal('projectModal');closeModal('calendarModal')}});
renderTasks();updateBackupInfo();
</script>
