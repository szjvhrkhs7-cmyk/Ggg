<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Задачи">
    <meta name="theme-color" content="#17212b">
    <title>Учет задач банковского юриста</title>
    <link rel="icon" type="image/png" href="icon-180.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Lora', Georgia, 'Times New Roman', serif;
            background: #0e1621; color: #f5f5f5; min-height: 100vh; padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: #17212b;
            color: #f5f5f5; padding: 22px 16px 0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
        .header-sub { font-size: 11px; opacity: 0.5; margin-top: 3px; font-style: italic; }
        .nav-bar { display: flex; gap: 3px; margin-top: 14px; }
        .nav-btn {
            flex: 1; text-align: center; padding: 10px 2px; font-size: 11px; font-weight: 700;
            font-family: 'Lora', Georgia, serif;
            color: #6d7f8e; background: rgba(255,255,255,0.04);
            border: none; border-radius: 12px 12px 0 0; cursor: pointer; transition: all 0.25s;
        }
        .nav-btn.active { color: #6ab2f2; background: #0e1621; }
        .nav-count {
            display: inline-block; background: rgba(106,178,242,0.15);
            border-radius: 8px; padding: 1px 6px; font-size: 9px; margin-left: 2px;
        }
        .nav-btn.active .nav-count { background: rgba(106,178,242,0.2); color: #6ab2f2; }
        .container { max-width: 800px; margin: 0 auto; padding: 14px; }
        .page { display: none; }
        .page.active { display: block; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
        .stat-card {
            background: #17212b; border-radius: 16px; padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2); border: 1px solid #232e3c;
        }
        .stat-card .label { font-size: 10px; color: #6d7f8e; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #6ab2f2; margin-top: 4px; }
        .stat-card.overdue .value { color: #e05555; }
        .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .controls-row { display: flex; gap: 8px; }
        .btn {
            padding: 11px 16px; border: none; border-radius: 14px; cursor: pointer;
            font-size: 13px; font-weight: 700; font-family: 'Lora', Georgia, serif;
            transition: all 0.2s; touch-action: manipulation;
        }
        .btn-primary {
            background: #2b5278;
            color: #f5f5f5; box-shadow: 0 2px 8px rgba(43,82,120,0.4);
        }
        .btn-primary:active { transform: scale(0.97); background: #3a6a94; }
        .btn-secondary { background: #232e3c; color: #6ab2f2; }
        .btn-secondary:active { background: #2b3a4c; }
        .btn-danger { background: rgba(224,85,85,0.15); color: #e05555; }
        .btn-danger:active { background: rgba(224,85,85,0.25); }
        .btn-success { background: rgba(79,174,78,0.15); color: #4fae4e; }
        .btn-success:active { background: rgba(79,174,78,0.25); }
        .btn-calendar { background: rgba(106,178,242,0.12); color: #6ab2f2; }
        .btn-calendar:active { background: rgba(106,178,242,0.22); }
        .btn-reopen { background: rgba(224,163,54,0.15); color: #e0a336; }
        .btn-reopen:active { background: rgba(224,163,54,0.25); }
        .btn-backup { background: rgba(79,174,78,0.12); color: #4fae4e; border: 1px solid rgba(79,174,78,0.25); }
        .btn-restore { background: rgba(224,163,54,0.12); color: #e0a336; border: 1px solid rgba(224,163,54,0.25); }
        .search-box {
            flex: 1; padding: 12px 16px; border: 2px solid #232e3c; border-radius: 14px;
            font-size: 14px; font-family: 'Lora', Georgia, serif; outline: none;
            background: #17212b; color: #f5f5f5;
        }
        .search-box:focus { border-color: #6ab2f2; }
        .search-box::placeholder { color: #6d7f8e; }
        .filter-select {
            padding: 12px 14px; border: 2px solid #232e3c; border-radius: 14px;
            font-size: 13px; font-family: 'Lora', Georgia, serif; outline: none;
            background: #17212b; color: #f5f5f5; cursor: pointer; flex: 1;
        }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card {
            background: #17212b; border-radius: 18px; padding: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2); border: 1px solid #232e3c;
            transition: all 0.3s;
        }
        .task-card.overdue { border-left: 4px solid #e05555; background: #1a1519; }
        .task-card.completed { border-left: 4px solid #4fae4e; background: #141d17; }
        .task-card.priority-high-card { border-top: 3px solid #e05555; }
        .task-card.priority-medium-card { border-top: 3px solid #e0a336; }
        .task-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .task-number { font-size: 11px; color: #6d7f8e; font-weight: 700; font-style: italic; }
        .status-badge {
            display: inline-block; padding: 4px 11px; border-radius: 20px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
        }
        .status-new { background: rgba(106,178,242,0.15); color: #6ab2f2; }
        .status-in-progress { background: rgba(224,163,54,0.18); color: #e0a336; }
        .status-waiting { background: rgba(195,80,140,0.18); color: #d475a8; }
        .status-completed { background: rgba(79,174,78,0.18); color: #4fae4e; }
        .priority-badge {
            display: inline-flex; padding: 3px 8px; border-radius: 8px;
            font-size: 10px; font-weight: 700; margin-left: 6px; text-transform: uppercase;
        }
        .priority-high { background: rgba(224,85,85,0.18); color: #e05555; }
        .priority-medium { background: rgba(224,163,54,0.18); color: #e0a336; }
        .priority-low { background: rgba(106,178,242,0.15); color: #6ab2f2; }
        .task-summary { font-size: 15px; font-weight: 700; color: #f5f5f5; line-height: 1.5; margin-bottom: 12px; }
        .task-details { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
        .task-detail { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
        .task-detail-label { color: #6d7f8e; font-weight: 600; white-space: nowrap; min-width: 82px; font-style: italic; }
        .task-detail-value { color: #a8b8c8; word-break: break-word; }
        .task-notes {
            background: #1e2c3a; border-radius: 12px; padding: 12px 14px;
            margin-bottom: 14px; border: 1px solid #232e3c;
        }
        .task-notes-label { font-size: 10px; color: #6d7f8e; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .task-notes-text { font-size: 13px; color: #a8b8c8; line-height: 1.6; }
        .task-notes-text ul, .task-notes-text ol { padding-left: 20px; margin: 4px 0; }
        .task-notes-text li { margin-bottom: 2px; }
        .task-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .task-actions .btn { flex: 1; padding: 10px 10px; font-size: 12px; text-align: center; min-width: 0; }
        .overdue-date { color: #e05555; font-weight: 700; }
        .completed-date { font-size: 11px; color: #6d7f8e; margin-top: 8px; font-style: italic; }
        .backup-section { display: flex; gap: 8px; margin-bottom: 12px; }
        .backup-section .btn { flex: 1; font-size: 12px; padding: 10px 8px; }
        .backup-info { font-size: 11px; color: #6d7f8e; text-align: center; margin-bottom: 14px; font-style: italic; }
        .project-list, .notes-list { display: flex; flex-direction: column; gap: 12px; }
        .project-card, .note-card {
            background: #17212b; border-radius: 18px; padding: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2); border: 1px solid #232e3c;
            cursor: pointer;
        }
        .project-card:active, .note-card:active { background: #1e2c3a; }
        .project-card-header { display: flex; justify-content: space-between; align-items: center; }
        .project-name { font-size: 16px; font-weight: 700; color: #f5f5f5; }
        .project-count { font-size: 11px; color: #6d7f8e; background: #232e3c; padding: 3px 10px; border-radius: 12px; }
        .project-desc { font-size: 13px; color: #8b9bab; margin-top: 6px; font-style: italic; }
        .project-actions, .note-actions { display: flex; gap: 6px; margin-top: 12px; }
        .project-actions .btn, .note-actions .btn { padding: 8px 14px; font-size: 12px; }
        .project-inner-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .back-btn {
            background: #232e3c; color: #6ab2f2; border: none; border-radius: 12px;
            padding: 9px 16px; font-size: 13px; font-weight: 700; font-family: 'Lora', Georgia, serif; cursor: pointer;
        }
        .project-title { font-size: 17px; font-weight: 700; color: #f5f5f5; flex: 1; }
        .note-card-title { font-size: 16px; font-weight: 700; color: #f5f5f5; margin-bottom: 6px; }
        .note-card-preview { font-size: 13px; color: #8b9bab; line-height: 1.5; max-height: 60px; overflow: hidden; }
        .note-card-date { font-size: 11px; color: #6d7f8e; margin-top: 8px; font-style: italic; }
        .note-editor-page { display: none; }
        .note-editor-page.active { display: block; }
        .note-title-input {
            width: 100%; padding: 14px 0; border: none; border-bottom: 2px solid #232e3c;
            font-size: 20px; font-weight: 700; font-family: 'Lora', Georgia, serif;
            outline: none; background: transparent; color: #f5f5f5; margin-bottom: 12px;
        }
        .note-title-input:focus { border-color: #6ab2f2; }
        .note-title-input::placeholder { color: #6d7f8e; }
        .note-body-editor {
            border: 2px solid #232e3c; border-top: none; border-radius: 0 0 14px 14px;
            padding: 14px; min-height: 300px; font-size: 15px; font-family: 'Lora', Georgia, serif;
            color: #f5f5f5; line-height: 1.7; background: #17212b; outline: none;
        }
        .note-body-editor:focus { border-color: #6ab2f2; }
        .note-body-editor:empty:before { content: attr(data-placeholder); color: #6d7f8e; font-style: italic; }
        .note-body-editor ul, .note-body-editor ol { padding-left: 22px; margin: 6px 0; }
        .note-body-editor li { margin-bottom: 3px; }
        .note-body-editor h3 { font-size: 18px; margin: 10px 0 6px; }
        .note-editor-actions { display: flex; gap: 8px; margin-bottom: 14px; }
        .note-editor-actions .btn { font-size: 13px; padding: 10px 18px; }
        .completed-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; margin-top: 18px; background: #17212b; border-radius: 16px;
            border: 1px solid #232e3c; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .completed-toggle:active { background: #1e2c3a; }
        .completed-toggle-left { display: flex; align-items: center; gap: 10px; }
        .completed-toggle-label { font-size: 14px; font-weight: 700; color: #4fae4e; }
        .completed-toggle-count { font-size: 11px; color: #6d7f8e; background: rgba(79,174,78,0.12); padding: 3px 10px; border-radius: 12px; font-weight: 700; }
        .completed-toggle-arrow { font-size: 16px; color: #6d7f8e; transition: transform 0.3s; }
        .completed-toggle.open .completed-toggle-arrow { transform: rotate(180deg); }
        .completed-section { overflow: hidden; max-height: 0; transition: max-height 0.4s ease; }
        .completed-section.open { max-height: 9999px; }
        .completed-section .task-list { margin-top: 12px; }
        .empty-state { text-align: center; padding: 52px 20px; color: #6d7f8e; }
        .empty-state-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.35; }
        .empty-state p { font-size: 15px; margin-bottom: 4px; }
        .empty-state .sub { font-size: 13px; font-style: italic; }
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            z-index: 1000; justify-content: center; align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #17212b; border-radius: 22px 22px 0 0;
            padding: 20px 16px 34px; width: 100%; max-width: 560px;
            max-height: 93vh; overflow-y: auto;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.4); animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-handle { width: 40px; height: 5px; background: #2b3a4c; border-radius: 3px; margin: 0 auto 18px; }
        .modal h2 { font-size: 20px; margin-bottom: 22px; color: #f5f5f5; font-weight: 700; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #6d7f8e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 13px 14px; border: 2px solid #232e3c; border-radius: 14px;
            font-size: 14px; font-family: 'Lora', Georgia, serif; outline: none;
            background: #0e1621; color: #f5f5f5;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #6ab2f2; }
        .form-group textarea { resize: none; min-height: 60px; overflow: hidden; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: #6d7f8e; }
        .form-group select option { background: #17212b; color: #f5f5f5; }
        .editor-toolbar {
            display: flex; gap: 2px; padding: 6px 8px; background: #1e2c3a; border: 2px solid #232e3c;
            border-bottom: none; border-radius: 14px 14px 0 0; flex-wrap: wrap;
        }
        .editor-toolbar button {
            background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px;
            font-size: 13px; cursor: pointer; color: #8b9bab; font-family: 'Lora', Georgia, serif;
            font-weight: 700; transition: all 0.15s; min-width: 34px; text-align: center;
        }
        .editor-toolbar button:active { background: #2b3a4c; }
        .editor-toolbar .sep { width: 1px; background: #2b3a4c; margin: 4px 4px; }
        .editor-area {
            border: 2px solid #232e3c; border-top: none; border-radius: 0 0 14px 14px;
            padding: 12px 14px; min-height: 70px; font-size: 14px; font-family: 'Lora', Georgia, serif;
            color: #f5f5f5; line-height: 1.6; background: #0e1621; outline: none; overflow: hidden;
        }
        .editor-area:focus { border-color: #6ab2f2; }
        .editor-area:empty:before { content: attr(data-placeholder); color: #6d7f8e; font-style: italic; }
        .editor-area ul, .editor-area ol { padding-left: 22px; margin: 4px 0; }
        .editor-area li { margin-bottom: 2px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .modal-actions .btn { flex: 1; padding: 14px; font-size: 15px; }
        .fab {
            position: fixed; bottom: 22px; right: 22px; width: 58px; height: 58px;
            border-radius: 50%;
            background: #2b5278;
            color: #f5f5f5; border: none; font-size: 30px; font-weight: 300;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4); cursor: pointer; z-index: 50;
            display: flex; align-items: center; justify-content: center;
        }
        .fab:active { transform: scale(0.9); background: #3a6a94; }
        @media (min-width: 600px) {
            .container { padding: 22px; }
            .modal { border-radius: 22px; margin: auto; max-width: 520px; }
            .modal-overlay.active { align-items: center; }
            @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Задачи банковского юриста</h1>
        <div class="header-sub">Управление юридическими задачами</div>
        <div class="nav-bar">
            <button class="nav-btn active" id="navTasks" onclick="navigate('tasks')">Задачи <span class="nav-count" id="navTasksCount">0</span></button>
            <button class="nav-btn" id="navProjects" onclick="navigate('projects')">Проекты <span class="nav-count" id="navProjectsCount">0</span></button>
            <button class="nav-btn" id="navNotes" onclick="navigate('notes')">Заметки <span class="nav-count" id="navNotesCount">0</span></button>
        </div>
    </div>
    <div class="container">
        <div class="page active" id="pageTasks">
            <div class="stats" id="stats"></div>
            <div class="controls">
                <input type="text" class="search-box" id="searchBox" placeholder="Поиск..." oninput="renderTasks()">
                <div class="controls-row">
                    <select class="filter-select" id="filterStatus" onchange="renderTasks()">
                        <option value="all">Все активные</option>
                        <option value="new">Новая</option>
                        <option value="in-progress">В работе</option>
                        <option value="waiting">Ожидание</option>
                    </select>
                    <button class="btn btn-secondary" onclick="exportCSV()">CSV</button>
                </div>
            </div>
            <div class="backup-section">
                <button class="btn btn-backup" onclick="backupData()">Сохранить копию</button>
                <button class="btn btn-restore" onclick="document.getElementById('restoreFile').click()">Восстановить</button>
                <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(event)">
            </div>
            <div class="backup-info" id="backupInfo"></div>
            <div class="task-list" id="taskList"></div>
        </div>
        <div class="page" id="pageProjects">
            <div id="projectListView">
                <button class="btn btn-primary" onclick="openProjectModal()" style="width:100%;margin-bottom:14px">+ Новый проект</button>
                <div class="project-list" id="projectList"></div>
            </div>
            <div id="projectDetailView" style="display:none">
                <div class="project-inner-header">
                    <button class="back-btn" onclick="closeProjectDetail()">&#8592; Назад</button>
                    <div class="project-title" id="projectDetailTitle"></div>
                </div>
                <div class="task-list" id="projectTaskList"></div>
            </div>
        </div>
        <div class="page" id="pageNotes">
            <div id="notesListView">
                <input type="text" class="search-box" id="searchNotes" placeholder="Поиск по заметкам..." oninput="renderNotes()" style="margin-bottom:12px;width:100%">
                <div class="notes-list" id="notesList"></div>
            </div>
            <div id="noteEditorView" class="note-editor-page">
                <div class="note-editor-actions">
                    <button class="btn btn-secondary" onclick="closeNoteEditor()">&#8592; Назад</button>
                    <button class="btn btn-primary" onclick="saveCurrentNote()">Сохранить</button>
                    <button class="btn btn-danger" id="noteDeleteBtn" onclick="deleteCurrentNote()" style="display:none">Удалить</button>
                </div>
                <input type="text" class="note-title-input" id="noteTitle" placeholder="Заголовок заметки...">
                <div class="editor-toolbar" id="noteEditorToolbar">
                    <button type="button" onclick="noteCmd('bold')"><b>Ж</b></button>
                    <button type="button" onclick="noteCmd('italic')"><i>К</i></button>
                    <button type="button" onclick="noteCmd('underline')"><u>П</u></button>
                    <div class="sep"></div>
                    <button type="button" onclick="noteCmd('insertUnorderedList')">&#8226;</button>
                    <button type="button" onclick="noteCmd('insertOrderedList')">1.</button>
                    <div class="sep"></div>
                    <button type="button" onclick="noteCmd('formatBlock','H3')">H</button>
                    <button type="button" onclick="noteFontSize(2)" style="font-size:11px">A</button>
                    <button type="button" onclick="noteFontSize(4)" style="font-size:14px">A</button>
                    <button type="button" onclick="noteFontSize(6)" style="font-size:18px">A</button>
                    <div class="sep"></div>
                    <button type="button" onclick="noteCmd('strikeThrough')"><s>S</s></button>
                    <button type="button" onclick="noteCmd('justifyLeft')">&#8676;</button>
                    <button type="button" onclick="noteCmd('justifyCenter')">&#8596;</button>
                </div>
                <div class="note-body-editor" id="noteBody" contenteditable="true" data-placeholder="Начните писать..."></div>
            </div>
        </div>
    </div>
    <button class="fab" id="fabBtn" onclick="onFabClick()">+</button>

    <!-- Task Modal -->
    <div class="modal-overlay" id="taskModal" onclick="closeModalOv(event,'taskModal')">
        <div class="modal">
            <div class="modal-handle"></div>
            <h2 id="taskModalTitle">Новая задача</h2>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <input type="hidden" id="taskProjectId" value="">
                <div class="form-group"><label>Дата поступления *</label><input type="date" id="dateReceived" required></div>
                <div class="form-group"><label>Краткая суть задачи *</label><textarea id="summary" placeholder="Опишите суть задачи..." required oninput="autoGrow(this)"></textarea></div>
                <div class="form-group"><label>Что требуется дополнительно</label><textarea id="additionalInfo" placeholder="Документы, сведения..." oninput="autoGrow(this)"></textarea></div>
                <div class="form-group"><label>Дата ответа</label><input type="date" id="responseDate"></div>
                <div class="form-group"><label>Напоминание</label>

                <button type="button" class="btn btn-primary" onclick="confirmCalendar()">Добавить</button>

<script>
const DEFAULT_TASKS = [
    {"dateReceived":"2026-06-17","summary":"Правовой анализ договоров банковского вклада, информации на сайте и в ДБО в части повышенной процентной ставки по вкладу и НС","additionalInfo":"Анализ документов (Сапунова)","responseDate":"2026-06-24","reminderDays":1,"priority":"high","status":"completed","notes":"","id":1,"createdAt":"2026-06-17T14:52:34.353Z","completedAt":"2026-06-18"},
    {"dateReceived":"2026-06-17","summary":"Задача по вопросу прекращения ДКБО","additionalInfo":"Жду ответы на вопросы","responseDate":"","reminderDays":1,"priority":"none","status":"in-progress","notes":"","id":2,"createdAt":"2026-06-17T14:52:53.287Z"},
    {"dateReceived":"2026-06-17","summary":"Задача от Бурковой по форме обращения","additionalInfo":"Остудил со Стасом, надо выпустить","responseDate":"2026-06-18","reminderDays":1,"priority":"none","status":"completed","notes":"","id":3,"createdAt":"2026-06-17T14:53:12.145Z"},
    {"dateReceived":"2026-06-18","summary":"ДВОУ (в режиме сравнения)","additionalInfo":"","responseDate":"","reminderDays":1,"priority":"none","status":"in-progress","notes":"","id":4,"createdAt":"2026-06-18T14:22:40.609Z"}
];
const DEFAULT_PROJECTS = [{"name":"Торговый оборот","description":"Правовой анализ договоров банковского вклада, информации на сайте и в ДБО в части повышенной процентной ставки по вкладу и НС","id":1,"createdAt":"2026-06-18T15:08:11.244Z"}];
const DEFAULT_PT = {"1":[]};

let tasks = JSON.parse(localStorage.getItem('lawyerTasks') || 'null');
if (!tasks) { tasks = DEFAULT_TASKS; saveTasks(); }
let projects = JSON.parse(localStorage.getItem('lawyerProjects') || 'null');
if (!projects) { projects = DEFAULT_PROJECTS; saveProjects(); }
let projectTasks = JSON.parse(localStorage.getItem('lawyerProjectTasks') || 'null');
if (!projectTasks) { projectTasks = DEFAULT_PT; saveProjectTasks(); }
let userNotes = JSON.parse(localStorage.getItem('lawyerNotes') || 'null');
if (!userNotes) { userNotes = []; saveNotes(); }

let currentPage = 'tasks', currentProjectId = null, editingNoteId = null;

function saveTasks() { localStorage.setItem('lawyerTasks', JSON.stringify(tasks)); }
function saveProjects() { localStorage.setItem('lawyerProjects', JSON.stringify(projects)); }
function saveProjectTasks() { localStorage.setItem('lawyerProjectTasks', JSON.stringify(projectTasks)); }
function saveNotes() { localStorage.setItem('lawyerNotes', JSON.stringify(userNotes)); }
function nextId(a) { return (!a||!a.length) ? 1 : Math.max(...a.map(t=>t.id))+1; }
function fmtDate(d) { if(!d)return'—'; const[y,m,dd]=d.split('-'); return `${dd}.${m}.${y}`; }
function fmtDateTime(iso) { if(!iso)return''; const d=new Date(iso); return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function stLabel(s) { return{'new':'Новая','in-progress':'В работе','waiting':'Ожидание','completed':'Завершена'}[s]||s; }
function isOverdue(t) { return t.status!=='completed'&&t.responseDate&&new Date(t.responseDate)<new Date(new Date().toISOString().split('T')[0]); }
function esc(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

const ALLOWED_TAGS = ['B','I','U','UL','OL','LI','BR','FONT','SPAN','P','DIV','STRONG','EM','S','H3','H4'];
function sanitizeHtml(html) {
    if (!html) return '';
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    function clean(node) {
        Array.from(node.childNodes).forEach(child => {
            if (child.nodeType === 3) return;
            if (child.nodeType === 1) {
                if (!ALLOWED_TAGS.includes(child.tagName)) {
                    node.replaceChild(document.createTextNode(child.textContent), child);
                    return;
                }
                Array.from(child.attributes).forEach(a => {
                    if (a.name.startsWith('on') || a.value.trim().toLowerCase().startsWith('javascript:'))
                        child.removeAttribute(a.name);
                });
                if (child.tagName === 'FONT') {
                    const ok = ['size','color'];
                    Array.from(child.attributes).forEach(a => { if (!ok.includes(a.name)) child.removeAttribute(a.name); });
                }
                clean(child);
            } else { node.removeChild(child); }
        });
    }
    clean(tmp);
    return tmp.innerHTML;
}

const VALID_STATUSES = ['new','in-progress','waiting','completed'];
const VALID_PRIORITIES = ['none','low','medium','high'];
function sanitizeTask(t) {
    if (!t || typeof t !== 'object') return null;
    return {
        id: typeof t.id === 'number' ? t.id : 0,
        dateReceived: typeof t.dateReceived === 'string' ? t.dateReceived.slice(0,10) : '',
        summary: typeof t.summary === 'string' ? t.summary.slice(0,2000) : '',
        additionalInfo: typeof t.additionalInfo === 'string' ? t.additionalInfo.slice(0,2000) : '',
        responseDate: typeof t.responseDate === 'string' ? t.responseDate.slice(0,10) : '',
        reminderDays: typeof t.reminderDays === 'number' ? Math.min(Math.max(t.reminderDays,0),30) : 1,
        priority: VALID_PRIORITIES.includes(t.priority) ? t.priority : 'none',
        status: VALID_STATUSES.includes(t.status) ? t.status : 'new',
        notes: sanitizeHtml(typeof t.notes === 'string' ? t.notes.slice(0,50000) : ''),
        createdAt: typeof t.createdAt === 'string' ? t.createdAt : new Date().toISOString(),
        completedAt: typeof t.completedAt === 'string' ? t.completedAt.slice(0,10) : undefined
    };
}
function sanitizeNote(n) {
    if (!n || typeof n !== 'object') return null;
    return {
        id: typeof n.id === 'number' ? n.id : 0,
        title: typeof n.title === 'string' ? n.title.slice(0,500) : '',
        body: sanitizeHtml(typeof n.body === 'string' ? n.body.slice(0,100000) : ''),
        createdAt: typeof n.createdAt === 'string' ? n.createdAt : new Date().toISOString(),
        updatedAt: typeof n.updatedAt === 'string' ? n.updatedAt : new Date().toISOString()
    };
}

function execCmd(cmd) { document.execCommand(cmd, false, null); document.getElementById('notesEditor').focus(); }
function setFontSize(size) { document.execCommand('fontSize', false, size); document.getElementById('notesEditor').focus(); }
function noteCmd(cmd, val) { document.execCommand(cmd, false, val||null); document.getElementById('noteBody').focus(); }
function noteFontSize(size) { document.execCommand('fontSize', false, size); document.getElementById('noteBody').focus(); }
function autoGrow(el) { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

function navigate(p) {
    currentPage=p;
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
    document.getElementById('page'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');
    document.getElementById('nav'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');
    document.getElementById('fabBtn').style.display='flex';
    if(p==='tasks')renderTasks();
    else if(p==='projects'){closeProjectDetail();renderProjects();}
    else if(p==='notes'){closeNoteEditor();renderNotes();}
}
function updateNav() {
    document.getElementById('navTasksCount').textContent=tasks.filter(t=>t.status!=='completed').length;
    document.getElementById('navProjectsCount').textContent=projects.length;
    document.getElementById('navNotesCount').textContent=userNotes.length;
}

function updateStats() {
    const a=tasks.filter(t=>t.status!=='completed').length, o=tasks.filter(t=>isOverdue(t)).length, c=tasks.filter(t=>t.status==='completed').length;
    document.getElementById('stats').innerHTML=`
        <div class="stat-card"><div class="label">В работе</div><div class="value">${a}</div></div>
        <div class="stat-card ${o?'overdue':''}"><div class="label">Просрочено</div><div class="value">${o}</div></div>
        <div class="stat-card"><div class="label">Завершено</div><div class="value">${c}</div></div>`;
}

function getFiltered(list, sId, fId, active) {
    const s=document.getElementById(sId)?document.getElementById(sId).value.toLowerCase():'';
    const f=fId&&document.getElementById(fId)?document.getElementById(fId).value:'all';
    let r=list.filter(t=>{
        if(active&&t.status==='completed')return false;
        if(!active&&t.status!=='completed')return false;
        const ms=!s||t.summary.toLowerCase().includes(s)||(t.additionalInfo&&t.additionalInfo.toLowerCase().includes(s))||(t.notes&&t.notes.toLowerCase().includes(s))||String(t.id).includes(s);
        const mf=!fId||f==='all'||t.status===f;
        return ms&&mf;
    });
    const pw={high:3,medium:2,low:1,none:0};
    if(active) r.sort((a,b)=>(pw[b.priority||'none']||0)-(pw[a.priority||'none']||0)||(b.id-a.id));
    else r.sort((a,b)=>b.id-a.id);
    return r;
}

function cardHtml(t, done, pid) {
    const pri=VALID_PRIORITIES.includes(t.priority)?t.priority:'none';
    let cls=done?'completed':isOverdue(t)?'overdue':'';
    if(!done&&(pri==='high'||pri==='medium'))cls+=' priority-'+pri+'-card';
    const dc=isOverdue(t)?'overdue-date':'';
    const plbl={high:'Высокая',medium:'Средняя',low:'Низкая'};
    const priH=pri!=='none'?`<span class="priority-badge priority-${pri}">${plbl[pri]}</span>`:'';
    const safeNotes=t.notes?sanitizeHtml(t.notes):'';
    const notesH=safeNotes?`<div class="task-notes"><div class="task-notes-label">Заметки</div><div class="task-notes-text">${safeNotes}</div></div>`:'';
    const addH=t.additionalInfo?`<div class="task-detail"><span class="task-detail-label">Доп. инфо:</span><span class="task-detail-value">${esc(t.additionalInfo)}</span></div>`:'';
    const cdH=t.completedAt?`<div class="completed-date">Завершена: ${fmtDate(t.completedAt)}</div>`:'';
    const safeStatus=VALID_STATUSES.includes(t.status)?t.status:'new';
    const pa=pid?`,${pid}`:'';
    let acts;
    if(done){
        acts=`<div class="task-actions"><button class="btn btn-reopen" onclick="reopenTask(${t.id}${pa})">В работу</button><button class="btn btn-danger" onclick="deleteTask(${t.id}${pa})">Удалить</button></div>`;
    } else {
        acts=`<div class="task-actions"><button class="btn btn-secondary" onclick="editTask(${t.id}${pa})">Изменить</button><button class="btn btn-success" onclick="completeTask(${t.id}${pa})">Готово</button><button class="btn btn-calendar" onclick="openCalendarModal(${t.id}${pa})">Календарь</button><button class="btn btn-danger" onclick="deleteTask(${t.id}${pa})">Удалить</button></div>`;
    }
    return `<div class="task-card ${cls}">
        <div class="task-card-header"><span class="task-number">#${t.id}${priH}</span><span class="status-badge status-${safeStatus}">${stLabel(safeStatus)}</span></div>
        <div class="task-summary">${esc(t.summary)}</div>
        <div class="task-details">
            <div class="task-detail"><span class="task-detail-label">Поступила:</span><span class="task-detail-value">${fmtDate(t.dateReceived)}</span></div>
            ${addH}
            <div class="task-detail"><span class="task-detail-label">Ответ до:</span><span class="task-detail-value ${dc}">${fmtDate(t.responseDate)}</span></div>
        </div>${notesH}${cdH}${acts}</div>`;
}

let completedOpen = false;
function renderTasks() {
    updateStats(); updateNav();
    const f=getFiltered(tasks,'searchBox','filterStatus',true), el=document.getElementById('taskList');
    let h=f.length?f.map(t=>cardHtml(t,false)).join(''):'<div class="empty-state"><div class="empty-state-icon">&#128221;</div><p>Нет активных задач</p><p class="sub">Нажмите + чтобы добавить</p></div>';
    const done=tasks.filter(t=>t.status==='completed').sort((a,b)=>b.id-a.id);
    if(done.length){
        h+=`<div class="completed-toggle ${completedOpen?'open':''}" onclick="toggleCompleted()">
            <div class="completed-toggle-left"><span class="completed-toggle-label">Завершённые</span><span class="completed-toggle-count">${done.length}</span></div>
            <span class="completed-toggle-arrow">&#9660;</span></div>`;
        h+=`<div class="completed-section ${completedOpen?'open':''}"><div class="task-list">${done.map(t=>cardHtml(t,true)).join('')}</div></div>`;
    }
    el.innerHTML=h;
    updateBackupInfo();
}
function toggleCompleted() {
    completedOpen=!completedOpen;
    const tog=document.querySelector('.completed-toggle');
    const sec=document.querySelector('.completed-section');
    if(tog)tog.classList.toggle('open',completedOpen);
    if(sec)sec.classList.toggle('open',completedOpen);
}

function getList(pid) { return pid?projectTasks[pid]||[]:tasks; }
function setList(pid,l) { if(pid){projectTasks[pid]=l;saveProjectTasks();}else{tasks=l;saveTasks();} }

function openTaskModal(pid) {
    document.getElementById('taskModalTitle').textContent='Новая задача';
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value='';
    document.getElementById('taskProjectId').value=pid||'';
    document.getElementById('dateReceived').value=new Date().toISOString().split('T')[0];
    document.getElementById('notesEditor').innerHTML='';
    document.querySelectorAll('#taskForm textarea').forEach(t=>{t.style.height='auto';});
    document.getElementById('taskModal').classList.add('active');
}
function editTask(id,pid) {
    const l=getList(pid), t=l.find(x=>x.id===id); if(!t)return;
    document.getElementById('taskModalTitle').textContent='Редактировать #'+t.id;
    document.getElementById('taskId').value=t.id;
    document.getElementById('taskProjectId').value=pid||'';
    document.getElementById('dateReceived').value=t.dateReceived;
    document.getElementById('summary').value=t.summary;
    document.getElementById('additionalInfo').value=t.additionalInfo||'';
    document.getElementById('responseDate').value=t.responseDate||'';
    document.getElementById('reminderDays').value=t.reminderDays!=null?t.reminderDays:1;
    document.getElementById('priority').value=t.priority||'none';
    document.getElementById('status').value=t.status;
    document.getElementById('notesEditor').innerHTML=t.notes||'';
    document.querySelectorAll('#taskForm textarea').forEach(el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px';});
    document.getElementById('taskModal').classList.add('active');
}
function saveTask(e) {
    e.preventDefault();
    const id=document.getElementById('taskId').value;
    const pid=document.getElementById('taskProjectId').value||null;
    const list=getList(pid);
    const ns=document.getElementById('status').value;
    const d={
        dateReceived:document.getElementById('dateReceived').value,
        summary:document.getElementById('summary').value.trim(),
        additionalInfo:document.getElementById('additionalInfo').value.trim(),
        responseDate:document.getElementById('responseDate').value,
        reminderDays:parseInt(document.getElementById('reminderDays').value)||0,
        priority:document.getElementById('priority').value,
        status:ns,
        notes:sanitizeHtml(document.getElementById('notesEditor').innerHTML.trim())
    };
    if(ns==='completed')d.completedAt=new Date().toISOString().split('T')[0];
    if(id){const i=list.findIndex(x=>x.id===Number(id));if(i!==-1)list[i]={...list[i],...d};}
    else{d.id=nextId(list);d.createdAt=new Date().toISOString();list.push(d);}
    setList(pid,list); closeModal('taskModal'); refreshView();
}
function completeTask(id,pid) {
    const l=getList(pid),t=l.find(x=>x.id===id); if(!t)return;
    t.status='completed'; t.completedAt=new Date().toISOString().split('T')[0];
    if(!t.responseDate)t.responseDate=t.completedAt;
    setList(pid,l); refreshView();
}
function reopenTask(id,pid) {
    const l=getList(pid),t=l.find(x=>x.id===id); if(!t)return;
    t.status='in-progress'; delete t.completedAt;
    setList(pid,l); refreshView();
}
function deleteTask(id,pid) {
    if(!confirm('Удалить задачу #'+id+'?'))return;
    setList(pid,getList(pid).filter(x=>x.id!==id)); refreshView();
}

function openCalendarModal(id,pid) {
    const t=(getList(pid)).find(x=>x.id===id); if(!t)return;
    document.getElementById('calTaskId').value=id;
    document.getElementById('calProjectId').value=pid||'';
    const pl={high:'Высокая',medium:'Средняя',low:'Низкая'};
    const priText=t.priority&&t.priority!=='none'?' ('+pl[t.priority]+')':'';
    document.getElementById('calTaskInfo').innerHTML='<b>#'+t.id+priText+'</b><br>'+esc(t.summary);
    const now=new Date();
    if(t.responseDate){
        document.getElementById('calDate').value=t.responseDate;
    } else {
        document.getElementById('calDate').value=now.toISOString().split('T')[0];
    }
    document.getElementById('calTime').value='09:00';
    document.getElementById('calendarModal').classList.add('active');
}
function confirmCalendar() {
    const id=Number(document.getElementById('calTaskId').value);
    const pid=document.getElementById('calProjectId').value||null;
    const t=(getList(pid)).find(x=>x.id===id); if(!t)return;
    const dateVal=document.getElementById('calDate').value;
    const timeVal=document.getElementById('calTime').value;
    if(!dateVal||!timeVal){alert('Укажите дату и время');return;}
    const dt=dateVal.replace(/-/g,'')+'T'+timeVal.replace(/:/g,'')+'00';
    const endD=new Date(dateVal+'T'+timeVal);
    endD.setHours(endD.getHours()+1);
    const pad=n=>String(n).padStart(2,'0');
    const et=endD.getFullYear()+pad(endD.getMonth()+1)+pad(endD.getDate())+'T'+pad(endD.getHours())+pad(endD.getMinutes())+'00';
    const pl={high:'ВЫСОКАЯ',medium:'СРЕДНЯЯ',low:'НИЗКАЯ'};
    const pt=t.priority&&t.priority!=='none'?' ['+pl[t.priority]+']':'';
    let desc=t.summary;
    if(t.additionalInfo)desc+='\\nДоп.: '+t.additionalInfo;
    if(t.responseDate)desc+='\\nОтвет до: '+fmtDate(t.responseDate);
    const plainNotes=t.notes?t.notes.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' '):'';
    if(plainNotes)desc+='\\nЗаметки: '+plainNotes;
    desc=desc.replace(/[\r\n]+/g,'\\n');
    const escI=s=>s.replace(/[\r\n]+/g,' ').replace(/[\\;,]/g,c=>'\\'+c);
    const uid='task-'+t.id+'-'+Date.now()+'@lawyer-tasks';
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lawyer Tasks//RU','CALSCALE:GREGORIAN',
        'BEGIN:VEVENT','UID:'+uid,'DTSTART:'+dt,'DTEND:'+et,
        'SUMMARY:'+escI(t.summary+pt),'DESCRIPTION:'+escI(desc),
        'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Задача #'+t.id,'END:VALARM',
        'END:VEVENT','END:VCALENDAR'];
    const blob=new Blob([ics.join('\r\n')],{type:'text/calendar;charset=utf-8'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='task_'+t.id+'.ics'; a.click(); URL.revokeObjectURL(url);
    closeModal('calendarModal');
}

function renderProjects() {
    updateNav();
    const el=document.getElementById('projectList');
    if(!projects.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">&#128194;</div><p>Нет проектов</p><p class="sub">Создайте первый проект</p></div>';return;}
    el.innerHTML=projects.map(p=>{
        const pts=projectTasks[p.id]||[]; const ac=pts.filter(t=>t.status!=='completed').length;
        return `<div class="project-card" onclick="openProjectDetail(${p.id})">
            <div class="project-card-header"><span class="project-name">${esc(p.name)}</span><span class="project-count">${ac} акт.</span></div>
            ${p.description?`<div class="project-desc">${esc(p.description)}</div>`:''}
            <div class="project-actions" onclick="event.stopPropagation()">
                <button class="btn btn-secondary" onclick="editProject(${p.id})">Изменить</button>
                <button class="btn btn-danger" onclick="deleteProject(${p.id})">Удалить</button>
            </div></div>`;
    }).join('');
}
function openProjectModal(id) {
    document.getElementById('projectForm').reset(); document.getElementById('projectId').value='';
    document.getElementById('projectModalTitle').textContent='Новый проект';
    if(id){const p=projects.find(x=>x.id===id);if(p){document.getElementById('projectModalTitle').textContent='Редактировать';document.getElementById('projectId').value=p.id;document.getElementById('projectName').value=p.name;document.getElementById('projectDesc').value=p.description||'';}}
    document.getElementById('projectModal').classList.add('active');
}
function editProject(id){openProjectModal(id);}
function saveProject(e) {
    e.preventDefault(); const id=document.getElementById('projectId').value;
    const d={name:document.getElementById('projectName').value.trim(),description:document.getElementById('projectDesc').value.trim()};
    if(id){const p=projects.find(x=>x.id===Number(id));if(p){p.name=d.name;p.description=d.description;}}
    else{d.id=projects.length?Math.max(...projects.map(x=>x.id))+1:1;d.createdAt=new Date().toISOString();projects.push(d);if(!projectTasks[d.id])projectTasks[d.id]=[];saveProjectTasks();}
    saveProjects(); closeModal('projectModal'); renderProjects();
}
function deleteProject(id) {
    const p=projects.find(x=>x.id===id);if(!p)return;
    const tc=(projectTasks[id]||[]).length;
    if(!confirm('Удалить проект "'+p.name+'"'+(tc?' и '+tc+' задач':'')+'?'))return;
    projects=projects.filter(x=>x.id!==id); delete projectTasks[id];
    saveProjects(); saveProjectTasks(); renderProjects();
}
function openProjectDetail(id) {
    currentProjectId=id; const p=projects.find(x=>x.id===id);if(!p)return;
    document.getElementById('projectDetailTitle').textContent=p.name;
    document.getElementById('projectListView').style.display='none';
    document.getElementById('projectDetailView').style.display='block';
    renderProjectTasks();
}
function closeProjectDetail() { currentProjectId=null; document.getElementById('projectListView').style.display='block'; document.getElementById('projectDetailView').style.display='none'; renderProjects(); }
function renderProjectTasks() {
    if(!currentProjectId)return;
    const list=projectTasks[currentProjectId]||[], el=document.getElementById('projectTaskList');
    const active=list.filter(t=>t.status!=='completed'), done=list.filter(t=>t.status==='completed');
    const pw={high:3,medium:2,low:1,none:0};
    active.sort((a,b)=>(pw[b.priority||'none']||0)-(pw[a.priority||'none']||0)||b.id-a.id);
    done.sort((a,b)=>b.id-a.id);
    let h='';
    if(!active.length&&!done.length) h='<div class="empty-state"><div class="empty-state-icon">&#128221;</div><p>Нет задач</p><p class="sub">Нажмите + чтобы добавить</p></div>';
    else {
        h=active.map(t=>cardHtml(t,false,currentProjectId)).join('');
        if(done.length) h+=`<div style="margin:18px 0 10px;font-size:11px;font-weight:700;color:#99a3b3;text-transform:uppercase;letter-spacing:0.5px">Завершённые (${done.length})</div>`+done.map(t=>cardHtml(t,true,currentProjectId)).join('');
    }
    el.innerHTML=h;
}

// --- NOTES ---
function renderNotes() {
    updateNav();
    const el=document.getElementById('notesList');
    const s=(document.getElementById('searchNotes').value||'').toLowerCase();
    let filtered=userNotes;
    if(s) filtered=userNotes.filter(n=>n.title.toLowerCase().includes(s)||(n.body&&n.body.toLowerCase().includes(s)));
    filtered.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    if(!filtered.length){
        el.innerHTML='<div class="empty-state"><div class="empty-state-icon">&#128196;</div><p>Нет заметок</p><p class="sub">Нажмите + чтобы создать</p></div>';
        return;
    }
    el.innerHTML=filtered.map(n=>{
        const preview=n.body?n.body.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').slice(0,120):'';
        return `<div class="note-card" onclick="openNoteEditor(${n.id})">
            <div class="note-card-title">${esc(n.title||'Без заголовка')}</div>
            ${preview?`<div class="note-card-preview">${esc(preview)}${preview.length>=120?'...':''}</div>`:''}
            <div class="note-card-date">${fmtDateTime(n.updatedAt)}</div>
        </div>`;
    }).join('');
}
function openNoteEditor(id) {
    if(id) {
        const n=userNotes.find(x=>x.id===id); if(!n)return;
        editingNoteId=id;
        document.getElementById('noteTitle').value=n.title||'';
        document.getElementById('noteBody').innerHTML=n.body||'';
        document.getElementById('noteDeleteBtn').style.display='inline-block';
    } else {
        editingNoteId=null;
        document.getElementById('noteTitle').value='';
        document.getElementById('noteBody').innerHTML='';
        document.getElementById('noteDeleteBtn').style.display='none';
    }
    document.getElementById('notesListView').style.display='none';
    document.getElementById('noteEditorView').style.display='block';
    document.getElementById('noteEditorView').classList.add('active');
    document.getElementById('fabBtn').style.display='none';
}
function closeNoteEditor() {
    editingNoteId=null;
    document.getElementById('notesListView').style.display='block';
    document.getElementById('noteEditorView').style.display='none';
    document.getElementById('noteEditorView').classList.remove('active');
    document.getElementById('fabBtn').style.display='flex';
    renderNotes();
}
function saveCurrentNote() {
    const title=document.getElementById('noteTitle').value.trim();
    const body=sanitizeHtml(document.getElementById('noteBody').innerHTML.trim());
    if(!title&&!body){alert('Заметка пуста');return;}
    if(editingNoteId) {
        const n=userNotes.find(x=>x.id===editingNoteId);
        if(n){n.title=title;n.body=body;n.updatedAt=new Date().toISOString();}
    } else {
        userNotes.push({id:nextId(userNotes),title,body,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    }
    saveNotes(); closeNoteEditor();
}
function deleteCurrentNote() {
    if(!editingNoteId)return;
    if(!confirm('Удалить заметку?'))return;
    userNotes=userNotes.filter(x=>x.id!==editingNoteId);
    saveNotes(); closeNoteEditor();
}

function closeModal(id){document.getElementById(id).classList.remove('active');}
function closeModalOv(e,id){if(e.target===e.currentTarget)closeModal(id);}
function onFabClick() {
    if(currentPage==='tasks')openTaskModal();
    else if(currentPage==='projects'){if(currentProjectId)openTaskModal(currentProjectId);else openProjectModal();}
    else if(currentPage==='notes')openNoteEditor();
}
function refreshView() {
    if(currentPage==='tasks')renderTasks();
    else if(currentPage==='projects'){if(currentProjectId)renderProjectTasks();else renderProjects();}
    else if(currentPage==='notes')renderNotes();
}

function backupData() {
    const data={version:3,exportDate:new Date().toISOString(),tasks,projects,projectTasks,userNotes};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;
    a.download='tasks_backup_'+new Date().toISOString().split('T')[0]+'.json'; a.click(); URL.revokeObjectURL(url);
    localStorage.setItem('lastBackupDate',new Date().toISOString()); updateBackupInfo();
}
function restoreData(event) {
    const file=event.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
        try{
            const data=JSON.parse(e.target.result);
            let raw=[];
            if(data.tasks&&Array.isArray(data.tasks))raw=data.tasks; else if(Array.isArray(data))raw=data;
            else{alert('Неверный формат');return;}
            let rt=raw.map(sanitizeTask).filter(Boolean);
            if(!rt.length){alert('Нет корректных задач в файле');return;}
            if(tasks.length>0&&!confirm('Заменить '+tasks.length+' задач на '+rt.length+' из файла?')){
                const mx=tasks.length?Math.max(...tasks.map(t=>t.id)):0;
                rt.forEach((t,i)=>{t.id=mx+i+1;}); tasks=tasks.concat(rt);
            } else tasks=rt;
            if(data.projects&&Array.isArray(data.projects)){
                projects=data.projects.filter(p=>p&&typeof p==='object'&&typeof p.name==='string')
                    .map(p=>({id:typeof p.id==='number'?p.id:0,name:p.name.slice(0,500),description:typeof p.description==='string'?p.description.slice(0,2000):'',createdAt:typeof p.createdAt==='string'?p.createdAt:new Date().toISOString()}));
                saveProjects();
            }
            if(data.projectTasks&&typeof data.projectTasks==='object'&&!Array.isArray(data.projectTasks)){
                const safePT={};
                Object.keys(data.projectTasks).forEach(k=>{
                    if(/^\d+$/.test(k)&&Array.isArray(data.projectTasks[k]))
                        safePT[k]=data.projectTasks[k].map(sanitizeTask).filter(Boolean);
                });
                projectTasks=safePT; saveProjectTasks();
            }
            if(data.userNotes&&Array.isArray(data.userNotes)){
                userNotes=data.userNotes.map(sanitizeNote).filter(Boolean);
                saveNotes();
            }
            saveTasks(); refreshView(); alert('Восстановлено: '+rt.length+' задач'+(data.userNotes?' и '+(userNotes.length)+' заметок':''));
        }catch(err){alert('Ошибка чтения файла');}
    };
    reader.readAsText(file); event.target.value='';
}
function updateBackupInfo() {
    const lb=localStorage.getItem('lastBackupDate'), el=document.getElementById('backupInfo');
    if(!tasks.length){el.textContent='';return;}
    if(lb){const days=Math.floor((new Date()-new Date(lb))/864e5);el.textContent='Последняя копия: '+fmtDate(new Date(lb).toISOString().split('T')[0])+(days>=3?' — сохраните новую!':'');}
    else el.textContent='Сохраните резервную копию!';
}
function exportCSV() {
    if(!tasks.length){alert('Нет задач');return;}
    const pl={high:'Высокая',medium:'Средняя',low:'Низкая',none:'Обычная'};
    const h=['№','Дата поступления','Суть','Доп. инфо','Дата ответа','Значимость','Статус','Заметки'];
    const csvSafe=s=>{let v=(s||'').replace(/"/g,'""');if(/^[=+\-@|]/.test(v))v="'"+v;return'"'+v+'"';};
    const r=tasks.map(t=>[t.id,fmtDate(t.dateReceived),csvSafe(t.summary),
        csvSafe(t.additionalInfo),fmtDate(t.responseDate),pl[t.priority||'none'],stLabel(t.status),
        csvSafe((t.notes||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' '))]);
    const csv='﻿'+[h.join(';'),...r.map(x=>x.join(';'))].join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;
    a.download='tasks_'+new Date().toISOString().split('T')[0]+'.csv'; a.click(); URL.revokeObjectURL(url);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('taskModal');closeModal('projectModal');closeModal('calendarModal');}});
renderTasks(); updateBackupInfo();
</script>
